name: CI (GTK3V2MAIN)
on:
  push:
    branches:
      - GTK3V2MAIN
      - test/upstream-gtk3*
  pull_request:
    branches:
      - GTK3V2MAIN

jobs:
  doxygen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y cmake libgtk-3-dev doxygen graphviz libzip-dev zlib1g-dev
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug -DXTRKCAD_USE_DOXYGEN=ON -DXTRKCAD_TESTING=OFF
      - name: Build docs
        run: cmake --build build --target docs-doxygen

  c-tests-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y cmake libgtk-3-dev libcmocka-dev zlib1g-dev libzip-dev libmxml-dev librsvg2-bin gettext xvfb
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug -DXTRKCAD_TESTING=ON
      - name: Build
        run: cmake --build build --parallel $(nproc)
      - name: Test
        run: xvfb-run ctest --test-dir build --output-on-failure

  c-tests-arm64:
    # Native ARM64 runner — same architecture as Raspberry Pi 3/4/5
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y cmake libgtk-3-dev libcmocka-dev zlib1g-dev libzip-dev libmxml-dev librsvg2-bin gettext xvfb
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug -DXTRKCAD_TESTING=ON
      - name: Build
        run: cmake --build build --parallel $(nproc)
      - name: Test
        run: xvfb-run ctest --test-dir build --output-on-failure

  c-tests-linux-clang:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y cmake clang libgtk-3-dev libcmocka-dev zlib1g-dev libzip-dev libmxml-dev librsvg2-bin gettext xvfb
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug -DXTRKCAD_TESTING=ON -DCMAKE_C_COMPILER=clang
      - name: Build
        run: cmake --build build --parallel $(nproc)
      - name: Test
        run: xvfb-run ctest --test-dir build --output-on-failure

  c-tests-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        run: brew install gtk+3 cmocka libzip librsvg
      - name: Configure
        run: |
          GTK_PREFIX=$(brew --prefix gtk+3)
          export PKG_CONFIG_PATH="$GTK_PREFIX/lib/pkgconfig:$(brew --prefix)/lib/pkgconfig"
          GTK_LDFLAGS=$(pkg-config --libs-only-L gtk+-3.0)
          cmake -B build -DCMAKE_BUILD_TYPE=Debug -DXTRKCAD_TESTING=ON \
            -DCMAKE_PREFIX_PATH="$GTK_PREFIX;$(brew --prefix)" \
            -DCMAKE_EXE_LINKER_FLAGS="$GTK_LDFLAGS" \
            -DXTRKCAD_USE_APPLEHELP=OFF -DXTRKCAD_USE_BROWSER=ON
      - name: Build
        run: cmake --build build --parallel $(sysctl -n hw.ncpu)
      - name: Test
        run: ctest --test-dir build --output-on-failure

  # NOTE: Windows (mswlib/Win32) job removed — SF r6508 deleted the entire
  # mswlib directory from GTK3V2MAIN. This branch is now GTK3-only.
  # Windows would require GTK3 for Windows (MSYS2/MinGW), not tracked here.
