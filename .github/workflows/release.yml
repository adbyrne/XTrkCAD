name: Release (GTK3V2MAIN)

# Builds Release packages on every push to GTK3V2MAIN where the build and
# tests pass. Packages are uploaded as GitHub Actions artifacts (14-day
# retention) on every push. When a version tag (v*.*.*) is pushed, a
# permanent GitHub Release is also created with all packages attached.

on:
  push:
    branches:
      - GTK3V2MAIN
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      include_nsis:
        description: 'Build NSIS installer (experimental — DLLs not yet bundled via CMake install)'
        type: boolean
        default: false
      include_dmg:
        description: 'Attempt self-contained DMG build (requires gtk-mac-bundler, may fail)'
        type: boolean
        default: false

jobs:
  # ── Linux x86-64 — DEB + RPM + STGZ ───────────────────────────────────────
  package-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            cmake ninja-build \
            libgtk-3-dev libcmocka-dev zlib1g-dev libzip-dev libmxml-dev \
            librsvg2-bin gettext xvfb \
            dpkg-dev rpm

      - name: Configure (Release)
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DXTRKCAD_TESTING=ON

      - name: Build
        run: cmake --build build

      - name: Test
        run: xvfb-run ctest --test-dir build --output-on-failure

      - name: Package (DEB + RPM + STGZ + source archives)
        run: |
          cd build
          cpack -G DEB
          cpack -G RPM
          cpack -G STGZ
          cpack --config CPackSourceConfig.cmake -G TGZ
          cpack --config CPackSourceConfig.cmake -G ZIP

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: packages-linux-x86_64
          path: |
            build/*.deb
            build/*.rpm
            build/*.sh
            build/xtrkcad-source-*
          retention-days: 14

  # ── Linux ARM64 — DEB (Ubuntu 24.04) ──────────────────────────────────────
  package-linux-arm64-ubuntu:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            cmake ninja-build \
            libgtk-3-dev libcmocka-dev zlib1g-dev libzip-dev libmxml-dev \
            librsvg2-bin gettext xvfb \
            dpkg-dev

      - name: Configure (Release)
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DXTRKCAD_TESTING=ON

      - name: Build
        run: cmake --build build

      - name: Test
        run: xvfb-run ctest --test-dir build --output-on-failure

      - name: Package (DEB)
        run: cd build && cpack -G DEB

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: packages-linux-arm64-ubuntu
          path: build/*.deb
          retention-days: 14

  # ── Linux ARM64 — DEB (Debian 12 / Raspberry Pi OS Bookworm) ──────────────
  # Built inside a debian:bookworm container so the generated DEB declares
  # Debian 12 dependency versions.  Ubuntu 24.04 renames packages with a
  # "t64" suffix (libgtk-3-0t64, libzip4t64, …) that do not exist on Debian
  # 12 / Raspberry Pi OS, causing "unmet dependencies" errors there.
  package-linux-arm64-debian:
    runs-on: ubuntu-24.04-arm
    container: debian:bookworm
    steps:
      - name: Install git (required by actions/checkout)
        run: apt-get update -q && apt-get install -y git

      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          apt-get install -y \
            cmake ninja-build \
            libgtk-3-dev libcmocka-dev zlib1g-dev libzip-dev libmxml-dev \
            librsvg2-bin gettext xvfb \
            dpkg-dev file

      - name: Configure (Release)
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DXTRKCAD_TESTING=ON

      - name: Build
        run: cmake --build build

      - name: Test
        run: xvfb-run ctest --test-dir build --output-on-failure

      - name: Package (DEB)
        run: |
          cd build && cpack -G DEB
          for f in xtrkcad-setup-*aarch64.deb; do
            mv "$f" "${f%.aarch64.deb}-debian12.deb"
          done

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: packages-linux-arm64-debian
          path: build/*.deb
          retention-days: 14

  # ── macOS ARM64 — tar.gz (Homebrew-dependent) + DMG (self-contained) ───────
  package-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: brew install ninja gtk+3 cmocka libzip librsvg

      - name: Configure (Release)
        run: |
          GTK_PREFIX=$(brew --prefix gtk+3)
          export PKG_CONFIG_PATH="$GTK_PREFIX/lib/pkgconfig:$(brew --prefix)/lib/pkgconfig"
          GTK_LDFLAGS=$(pkg-config --libs-only-L gtk+-3.0)
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DXTRKCAD_TESTING=ON \
            -DCMAKE_PREFIX_PATH="$GTK_PREFIX;$(brew --prefix)" \
            -DCMAKE_EXE_LINKER_FLAGS="$GTK_LDFLAGS" \
            -DXTRKCAD_USE_APPLEHELP=OFF -DXTRKCAD_USE_BROWSER=ON

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Get version
        run: |
          MAJOR=$(awk -F'"' '/set\(XTRKCAD_MAJOR_VERSION/{print $2; exit}' ProgramVersion.cmake)
          MINOR=$(awk -F'"' '/set\(XTRKCAD_MINOR_VERSION/{print $2; exit}' ProgramVersion.cmake)
          PATCH=$(awk -F'"' '/set\(XTRKCAD_RELEASE_VERSION/{print $2; exit}' ProgramVersion.cmake)
          MODIFIER=$(awk -F'"' '/set\(XTRKCAD_VERSION_MODIFIER/{print $2; exit}' ProgramVersion.cmake)
          echo "XTRKCAD_VERSION=${MAJOR}.${MINOR}.${PATCH}${MODIFIER}" >> "$GITHUB_ENV"

      - name: Create Homebrew-dependent archive
        # Installs to a staging dir and tars it. Users must have the Homebrew
        # prerequisites: brew install gtk+3 libzip librsvg
        run: |
          cmake --install build --prefix staging
          tar -czf "xtrkcad-${XTRKCAD_VERSION}-macos-arm64.tar.gz" -C staging .

      - name: Upload Homebrew archive
        uses: actions/upload-artifact@v7
        with:
          name: packages-macos-arm64
          path: xtrkcad-*-macos-arm64.tar.gz
          retention-days: 14

      - name: Build self-contained DMG
        # Skipped on normal pushes — opt in via workflow_dispatch input.
        # The DMG is unsigned; a volunteer with an Apple Developer account can
        # sign and notarize it. gtk-mac-bundler is not a standard Homebrew
        # formula so this step may fail even when opted in.
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.include_dmg == true }}
        continue-on-error: true
        run: |
          brew install gtk-mac-bundler || true
          cmake --install build --prefix bundle-staging
          cd distribution/osx/gtk-bundle
          bash xtrkcad-bundler.sh -i "${{ github.workspace }}/bundle-staging" \
            -v "${XTRKCAD_VERSION}"

      - name: Upload DMG (if built)
        uses: actions/upload-artifact@v7
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.include_dmg == true }}
        with:
          name: packages-macos-arm64-dmg
          path: "distribution/osx/gtk-bundle/xtrkcad-OSX-*.dmg"
          retention-days: 14

  # ── Windows x86-64 — ZIP (DLLs bundled) + NSIS installer ──────────────────
  package-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v5

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pkg-config
            mingw-w64-x86_64-gtk3
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-libzip
            mingw-w64-x86_64-mxml
            mingw-w64-x86_64-librsvg
            mingw-w64-x86_64-gettext
            mingw-w64-x86_64-cmocka
            mingw-w64-x86_64-ntldd-git

      - name: Get version
        run: |
          MAJOR=$(awk -F'"' '/set\(XTRKCAD_MAJOR_VERSION/{print $2; exit}' ProgramVersion.cmake)
          MINOR=$(awk -F'"' '/set\(XTRKCAD_MINOR_VERSION/{print $2; exit}' ProgramVersion.cmake)
          PATCH=$(awk -F'"' '/set\(XTRKCAD_RELEASE_VERSION/{print $2; exit}' ProgramVersion.cmake)
          MODIFIER=$(awk -F'"' '/set\(XTRKCAD_VERSION_MODIFIER/{print $2; exit}' ProgramVersion.cmake)
          echo "XTRKCAD_VERSION=${MAJOR}.${MINOR}.${PATCH}${MODIFIER}" >> "$GITHUB_ENV"

      - name: Configure (Release)
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DXTRKCAD_TESTING=ON \
            -DXTRKCAD_USE_GETTEXT=OFF

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Install to staging directory
        run: cmake --install build --prefix "$(pwd)/staging"

      - name: Collect GTK3 runtime DLLs
        # Walk the binary's DLL dependencies and copy all MinGW64 DLLs.
        # Also copy GTK3 runtime data (pixbuf loaders, GSettings schemas,
        # icon theme) needed for a working installation.
        run: |
          STAGING="$(pwd)/staging"
          BINARY="$STAGING/bin/xtrkcad.exe"
          MINGW=/mingw64

          # Collect DLL dependencies (filter to MinGW64 only)
          ntldd -R "$BINARY" \
            | grep -i mingw64 \
            | awk '{print $3}' \
            | xargs -I{} cp -n "{}" "$STAGING/bin/" || true

          # GTK3 pixbuf loaders (needed for SVG icons and PNG images)
          GDK_VER=$(ls $MINGW/lib/gdk-pixbuf-2.0/)
          mkdir -p "$STAGING/lib/gdk-pixbuf-2.0/$GDK_VER/loaders"
          cp -r "$MINGW/lib/gdk-pixbuf-2.0/$GDK_VER/loaders.cache" \
                "$STAGING/lib/gdk-pixbuf-2.0/$GDK_VER/" || true
          cp "$MINGW/lib/gdk-pixbuf-2.0/$GDK_VER/loaders/"*.dll \
             "$STAGING/lib/gdk-pixbuf-2.0/$GDK_VER/loaders/" 2>/dev/null || true

          # GSettings compiled schemas (required by GTK3 on Windows)
          mkdir -p "$STAGING/share/glib-2.0/schemas"
          cp "$MINGW/share/glib-2.0/schemas/gschemas.compiled" \
             "$STAGING/share/glib-2.0/schemas/" || true

          # Hicolor icon theme (GTK3 fallback icons)
          mkdir -p "$STAGING/share/icons"
          cp -r "$MINGW/share/icons/hicolor" "$STAGING/share/icons/" || true

      - name: Create ZIP archive
        run: |
          cd staging
          cmake -E tar cf "../xtrkcad-${XTRKCAD_VERSION}-windows-x64.zip" \
            --format=zip .

      - name: Upload ZIP
        uses: actions/upload-artifact@v7
        with:
          name: packages-windows-x64-zip
          path: xtrkcad-*-windows-x64.zip
          retention-days: 14

      - name: Package NSIS installer
        # Skipped on normal pushes — opt in via workflow_dispatch input.
        # DLLs are not yet bundled via CMake install(); the ZIP (above) is
        # the recommended Windows distributable until NSIS bundling is solved.
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.include_nsis == true }}
        continue-on-error: true
        run: |
          cd build
          cpack -G NSIS

      - name: Upload NSIS installer (if built)
        uses: actions/upload-artifact@v7
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.include_nsis == true }}
        with:
          name: packages-windows-x64-nsis
          path: build/*.exe
          retention-days: 14

  # ── Doxygen documentation — built and uploaded on every push ──────────────
  # Gives a browsable "latest docs" artifact without waiting for a version
  # tag or for the Hg bug branches behind any given doc change to clear
  # their SF review window and merge into GTK3V2MAIN -- this job tracks
  # whatever's on the git mirror right now.
  package-docs:
    runs-on: ubuntu-latest
    env:
      DOXYGEN_VERSION: 1.15.0
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y cmake ninja-build libgtk-3-dev zlib1g-dev libzip-dev libmxml-dev librsvg2-bin gettext

      - name: Install pinned Doxygen ${{ env.DOXYGEN_VERSION }}
        run: |
          curl -sL -o doxygen.tar.gz "https://github.com/doxygen/doxygen/releases/download/Release_${DOXYGEN_VERSION//./_}/doxygen-${DOXYGEN_VERSION}.linux.bin.tar.gz"
          tar xzf doxygen.tar.gz
          echo "$PWD/doxygen-${DOXYGEN_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DXTRKCAD_USE_DOXYGEN=ON -DXTRKCAD_TESTING=OFF

      - name: Build docs
        run: cmake --build build --target docs-doxygen

      - name: Archive docs
        run: tar -czf xtrkcad-docs.tar.gz -C build/docs/doxygen/html .

      - name: Upload docs
        uses: actions/upload-artifact@v7
        with:
          name: xtrkcad-docs-html
          path: xtrkcad-docs.tar.gz
          retention-days: 14

  # ── GitHub Release — created only on version tags ──────────────────────────
  github-release:
    needs: [package-linux, package-linux-arm64-ubuntu, package-linux-arm64-debian, package-macos, package-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Download all packages
        uses: actions/download-artifact@v7
        with:
          path: release-packages
          merge-multiple: true

      - name: List packages
        run: find release-packages -type f | sort

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          # Flatten all artifact subdirectories into a single file list
          mapfile -t FILES < <(find release-packages -type f | sort)
          gh release create "$TAG" \
            --title "XTrkCAD ${TAG}" \
            --generate-notes \
            --draft \
            "${FILES[@]}"
