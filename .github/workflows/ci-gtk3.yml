name: CI (GTK3V2MAIN)
on:
  push:
    branches:
      - GTK3V2MAIN

jobs:
  mcp-tests:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - name: Run MCP tests
        working-directory: mcp
        run: uv run --extra dev pytest -q

  doxygen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y cmake ninja-build libgtk-3-dev doxygen graphviz
      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DXTRKCAD_USE_DOXYGEN=ON -DXTRKCAD_TESTING=OFF
      - name: Build docs
        run: cmake --build build --target docs-doxygen

  c-tests-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y cmake ninja-build libgtk-3-dev libcmocka-dev zlib1g-dev libzip-dev libmxml-dev librsvg2-bin
      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DXTRKCAD_TESTING=ON
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  c-tests-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        run: brew install ninja gtk+3 cmocka libzip librsvg
      - name: Configure
        run: |
          GTK_PREFIX=$(brew --prefix gtk+3)
          export PKG_CONFIG_PATH="$GTK_PREFIX/lib/pkgconfig:$(brew --prefix)/lib/pkgconfig"
          GTK_LDFLAGS=$(pkg-config --libs-only-L gtk+-3.0)
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DXTRKCAD_TESTING=ON \
            -DCMAKE_PREFIX_PATH="$GTK_PREFIX;$(brew --prefix)" \
            -DCMAKE_EXE_LINKER_FLAGS="$GTK_LDFLAGS"
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  c-tests-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Cache vcpkg packages
        uses: actions/cache@v5
        id: vcpkg-cache
        with:
          path: C:\vcpkg\installed
          key: vcpkg-x64-windows-cmocka-zlib-libzip-freeimage-v1
      - name: Install dependencies
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        run: vcpkg install cmocka:x64-windows zlib:x64-windows libzip:x64-windows freeimage:x64-windows
      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DXTRKCAD_TESTING=ON "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" "-DCMAKE_PREFIX_PATH=$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows"
      - name: Build
        run: |
          cmake --build build 2>&1 | Tee-Object -FilePath build/build-log.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: windows-build-log
          path: build/build-log.txt
      - name: Test
        run: ctest --test-dir build --output-on-failure
