name: Release

# Builds Release packages on every push to main where the build and
# tests pass. Packages are uploaded as GitHub Actions artifacts (14-day
# retention) on every push. When a version tag (v*.*.*) is pushed, a
# permanent GitHub Release is also created with all packages attached,
# once the tag matches ProgramVersion.cmake and every install test passed
# (check-release-tag, github-release).
#
# Two more things happen on every ordinary main push (not on tags or
# workflow_dispatch), giving stable links that never expire or change:
#   - publish-latest-release rolls the packages into a single moving
#     "latest-main" GitHub Release (prerelease, not marked "Latest").
#   - deploy-pages redeploys Doxygen + the user guide to GitHub Pages.

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      publish_temp_release:
        description: 'Publish packages to a temporary, branch-named prerelease (for review branches — see publish-temp-release job)'
        type: boolean
        default: false
      include_nsis:
        description: 'Build and install-test the NSIS installer (always done on version tags)'
        type: boolean
        default: false
      include_dmg:
        description: 'Attempt self-contained DMG build (requires gtk-mac-bundler, may fail)'
        type: boolean
        default: false
      linux:
        description: 'Linux: build and install-test the DEB/RPM packages'
        type: boolean
        default: true
      windows:
        description: 'Windows: build and install-test the ZIP (and NSIS, if chosen)'
        type: boolean
        default: true
      macos:
        description: 'macOS: build and install-test the archives (and DMG, if chosen)'
        type: boolean
        default: true
      packages_from_run:
        description: 'Run ID of an earlier Release run: install-test its packages instead of building new ones (artifacts last 14 days)'
        type: string
        default: ''

# Runners and compilers are pinned the same way as ci-gtk3.yml (see its
# header): ubuntu-24.04(-arm), plus ubuntu-26.04(-arm) for the Ubuntu
# 26.04 DEB, macos-26 and macos-26-intel with
# .github/actions/select-xcode, windows-2025 with
# .github/actions/msys2-pin-gcc. The report jobs come from
# gtk3-qa-reports.yml, shared with ci-gtk3.yml, so they can't drift apart.

jobs:
  # ── Dispatch inputs (Development Issues #59) ─────────────────────────────
  # linux/windows/macos choose the platforms a workflow_dispatch run builds
  # and install-tests. packages_from_run skips every build job and runs the
  # install tests on that earlier run's packages, with this run's checkout
  # of the tools/package-install-test* scripts. Use it after changing an
  # install-test script.
  #
  # Push and tag runs have no inputs, and an unset input compares equal to
  # false, so every condition below reads
  # "github.event_name != 'workflow_dispatch' || inputs.<x>": main and tag
  # runs always build and test everything.
  #
  # check-inputs runs on every event (it does nothing on push) so the build,
  # report and docs jobs can need it; on a dispatch it rejects combinations that would run
  # nothing or publish a partial temp release, and checks the source run.
  check-inputs:
    runs-on: ubuntu-24.04
    permissions:
      actions: read
    steps:
      - name: Check dispatch inputs
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ github.token }}
          LINUX: ${{ inputs.linux }}
          WINDOWS: ${{ inputs.windows }}
          MACOS: ${{ inputs.macos }}
          FROM_RUN: ${{ inputs.packages_from_run }}
          TEMP_RELEASE: ${{ inputs.publish_temp_release }}
        run: |
          if [ "$LINUX$WINDOWS$MACOS" = falsefalsefalse ]; then
            echo "::error::no platform selected"
            exit 1
          fi
          if [ "$TEMP_RELEASE" = true ] && { [ -n "$FROM_RUN" ] || [ "$LINUX$WINDOWS$MACOS" != truetruetrue ]; }; then
            echo "::error::publish_temp_release needs freshly built packages for every platform"
            exit 1
          fi
          [ -n "$FROM_RUN" ] || exit 0
          case "$FROM_RUN" in
          *[!0-9]*)
            echo "::error::packages_from_run must be a run ID, got '$FROM_RUN'"
            exit 1
            ;;
          esac
          INFO=$(gh run view "$FROM_RUN" --repo "$GITHUB_REPOSITORY" \
            --json workflowName,headBranch,headSha,conclusion,createdAt \
            --jq '"\(.workflowName)|\(.headBranch) \(.headSha[0:8]), \(.conclusion | if . == "" or . == null then "in progress" else . end), \(.createdAt)"')
          case "$INFO" in
          Release\|*) echo "install-testing packages from run $FROM_RUN: ${INFO#Release|}" ;;
          *)
            echo "::error::run $FROM_RUN is not a Release run (${INFO%%|*})"
            exit 1
            ;;
          esac

  # ── Linux — DEB (Ubuntu 24.04/26.04) + STGZ + source ───────────────────
  # One DEB per Ubuntu LTS. A DEB built on 24.04 does not install on 26.04
  # (it depends on libzip4t64; 26.04 only has libzip5, Development Issues
  # #37), so each release gets its own, named *-ubuntu2404.deb and
  # *-ubuntu2604.deb like the Debian ones. The 24.04 amd64 entry also builds
  # the STGZ installer and the source archives. The RPMs come from
  # package-linux-fedora.
  #
  # The runners are pinned to exact Ubuntu releases, never ubuntu-latest
  # (Ubuntu 26.04 from 2026-10-19), so a runner image change can't quietly
  # change which release a package is for.
  package-linux-ubuntu:
    needs: [check-inputs]
    if: ${{ github.event_name != 'workflow_dispatch' || (inputs.linux && inputs.packages_from_run == '') }}
    name: package-linux-ubuntu (${{ matrix.ubuntu }}, ${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ['24.04', '26.04']
        arch: [amd64, arm64]
        include:
          - ubuntu: '24.04'
            suffix: ubuntu2404
          - ubuntu: '26.04'
            suffix: ubuntu2604
          - arch: amd64
            runner-suffix: ''
          - arch: arm64
            runner-suffix: '-arm'
          - ubuntu: '24.04'
            arch: amd64
            extra-packages: true
    runs-on: ubuntu-${{ matrix.ubuntu }}${{ matrix.runner-suffix }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/apt-deps
        with:
          extra: doxygen dpkg-dev

      - name: Configure (Release)
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DXTRKCAD_TESTING=ON

      - name: Build
        run: cmake --build build

      - name: Test
        # The ~47 individual per-demo regression tests (XTRKCAD_REGRESSION_TESTING's
        # auto-detect default is ON here) are for local dev targeting only and are
        # not self-contained standalone -- see app/bin/RegressionTests.cmake. Mirror
        # ci-gtk3.yml: run everything else, then gate separately on the single-process
        # RegressionSuite (label regression-ci).
        run: |
          xvfb-run ctest --test-dir build --output-on-failure -LE regression
          ctest --test-dir build --output-on-failure -L regression-ci

      - name: Package (DEB)
        run: |
          cd build && cpack -G DEB
          for f in xtrkcad-setup-*.deb; do
            mv "$f" "${f%.deb}-${{ matrix.suffix }}.deb"
          done

      - name: Package (STGZ + source archives)
        if: matrix.extra-packages
        run: |
          cd build
          cpack -G STGZ
          cpack --config CPackSourceConfig.cmake -G TGZ
          cpack --config CPackSourceConfig.cmake -G ZIP

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: packages-linux-${{ matrix.suffix }}-${{ matrix.arch }}
          path: |
            build/*.deb
            build/*.sh
            build/xtrkcad-source-*
          retention-days: 14

  # ── Linux — DEB (Debian 12/13, Raspberry Pi OS Bookworm/Trixie) ─────────
  # Built inside a debian container so each DEB declares that release's own
  # dependency versions.  Ubuntu 24.04 renames packages with a "t64" suffix
  # (libgtk-3-0t64, libzip4t64, …) that do not exist on Debian 12 /
  # Raspberry Pi OS Bookworm, causing "unmet dependencies" errors there.
  # The arm64 builds cover Raspberry Pi 3/4/5 on 64-bit Pi OS; the amd64
  # builds cover plain Debian.
  package-linux-debian:
    needs: [check-inputs]
    if: ${{ github.event_name != 'workflow_dispatch' || (inputs.linux && inputs.packages_from_run == '') }}
    name: package-linux-debian (${{ matrix.debian }}, ${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        debian: [bookworm, trixie]
        arch: [amd64, arm64]
        include:
          - debian: bookworm
            suffix: debian12
          - debian: trixie
            suffix: debian13
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container: debian:${{ matrix.debian }}
    steps:
      - name: Install git (required by actions/checkout)
        run: apt-get update -q && apt-get install -y git

      - uses: actions/checkout@v7

      - name: Trust the checkout
        # The container runs as root but the workspace belongs to the runner
        # user, so git rejects it as "dubious ownership" and ProgramVersion.cmake
        # silently loses the source hash (the Debian 12 DEB used to be named
        # xtrkcad-setup-5.4.0-1-debian12.deb, with no hash).
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: ./.github/actions/apt-deps
        with:
          extra: doxygen dpkg-dev file

      - name: Configure (Release)
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DXTRKCAD_TESTING=ON

      - name: Build
        run: cmake --build build

      - name: Test
        # See package-linux's Test step comment: the per-demo regression tests
        # aren't self-contained standalone, so gate separately on RegressionSuite.
        run: |
          xvfb-run ctest --test-dir build --output-on-failure -LE regression
          ctest --test-dir build --output-on-failure -L regression-ci

      - name: Package (DEB)
        run: |
          cd build && cpack -G DEB
          for f in xtrkcad-setup-*.deb; do
            mv "$f" "${f%.deb}-${{ matrix.suffix }}.deb"
          done

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: packages-linux-${{ matrix.suffix }}-${{ matrix.arch }}
          path: build/*.deb
          retention-days: 14

  # ── Linux — RPM (Fedora 44/45) ────────────────────────────────────────
  # Built inside a fedora container, so each RPM requires that release's own
  # sonames. The RPM used to be built on Ubuntu and required Ubuntu's
  # libzip.so.4, which no Fedora release has (Development Issues #38).
  # Named *-fedora44.rpm and *-fedora45.rpm, like the DEBs.
  #
  # --privileged: Fedora's gdk-pixbuf loads images through glycin, which runs
  # each loader in a bwrap sandbox. bwrap can't create its namespaces in an
  # unprivileged container, so the SVG loader dies and GTK aborts on its
  # first icon, failing RegressionSuite. On a real system bwrap works.
  package-linux-fedora:
    needs: [check-inputs]
    if: ${{ github.event_name != 'workflow_dispatch' || (inputs.linux && inputs.packages_from_run == '') }}
    name: package-linux-fedora (${{ matrix.fedora }}, ${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        fedora: ['44', '45']
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container:
      image: fedora:${{ matrix.fedora }}
      options: --privileged
    steps:
      - name: Install build dependencies (dnf)
        # git is for actions/checkout and the source hash; rpm-build and file
        # are for CPack RPM. retries covers a slow or flaky mirror.
        run: |
          dnf -y --setopt=retries=10 install git cmake ninja-build gcc \
            gtk3-devel libcmocka-devel zlib-devel libzip-devel mxml-devel \
            librsvg2-tools gettext doxygen rpm-build file \
            xorg-x11-server-Xvfb xauth

      - uses: actions/checkout@v7

      - name: Trust the checkout
        # As in package-linux-debian: the container runs as root, the
        # workspace belongs to the runner user, and without this git refuses
        # it and the package loses its source hash.
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Configure (Release)
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DXTRKCAD_TESTING=ON

      - name: Build
        run: cmake --build build

      - name: Test
        # See package-linux-ubuntu's Test step comment: the per-demo regression
        # tests aren't self-contained standalone, so gate separately on
        # RegressionSuite.
        run: |
          xvfb-run -a ctest --test-dir build --output-on-failure -LE regression
          ctest --test-dir build --output-on-failure -L regression-ci

      - name: Package (RPM)
        run: |
          cd build && cpack -G RPM
          for f in xtrkcad-setup-*.rpm; do
            mv "$f" "${f%.rpm}-fedora${{ matrix.fedora }}.rpm"
          done

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: packages-linux-fedora${{ matrix.fedora }}-${{ matrix.arch }}
          path: build/*.rpm
          retention-days: 14

  # ── macOS ARM64 + Intel x86-64 — tar.gz (Homebrew-dependent) + DMG ────────
  # Intel Macs stay in use (macOS 26 is their last release, but they keep
  # running it; Oct 2026 user poll: 6 Intel vs 10 Apple Silicon), so both
  # architectures get a package. Same macOS and Xcode on both runners.
  package-macos:
    needs: [check-inputs]
    if: ${{ github.event_name != 'workflow_dispatch' || (inputs.macos && inputs.packages_from_run == '') }}
    name: package-macos (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-26
          - arch: x86_64
            runner: macos-26-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/select-xcode

      - name: Install dependencies
        run: brew install ninja gtk+3 cmocka libzip librsvg doxygen

      - name: Configure (Release)
        run: |
          GTK_PREFIX=$(brew --prefix gtk+3)
          export PKG_CONFIG_PATH="$GTK_PREFIX/lib/pkgconfig:$(brew --prefix)/lib/pkgconfig"
          GTK_LDFLAGS=$(pkg-config --libs-only-L gtk+-3.0)
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DXTRKCAD_TESTING=ON \
            -DCMAKE_PREFIX_PATH="$GTK_PREFIX;$(brew --prefix)" \
            -DCMAKE_EXE_LINKER_FLAGS="$GTK_LDFLAGS" \
            -DXTRKCAD_USE_APPLEHELP=OFF -DXTRKCAD_USE_BROWSER=ON

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Get version
        run: |
          MAJOR=$(awk -F'"' '/set\(XTRKCAD_MAJOR_VERSION/{print $2; exit}' ProgramVersion.cmake)
          MINOR=$(awk -F'"' '/set\(XTRKCAD_MINOR_VERSION/{print $2; exit}' ProgramVersion.cmake)
          PATCH=$(awk -F'"' '/set\(XTRKCAD_RELEASE_VERSION/{print $2; exit}' ProgramVersion.cmake)
          MODIFIER=$(awk -F'"' '/set\(XTRKCAD_VERSION_MODIFIER/{print $2; exit}' ProgramVersion.cmake)
          echo "XTRKCAD_VERSION=${MAJOR}.${MINOR}.${PATCH}${MODIFIER}" >> "$GITHUB_ENV"

      - name: Create Homebrew-dependent archive
        # Installs to a staging dir and tars it. Users must have the Homebrew
        # prerequisites: brew install gtk+3 libzip librsvg
        run: |
          cmake --install build --prefix staging
          tar -czf "xtrkcad-${XTRKCAD_VERSION}-macos-${{ matrix.arch }}.tar.gz" -C staging .

      - name: Upload Homebrew archive
        uses: actions/upload-artifact@v7
        with:
          name: packages-macos-${{ matrix.arch }}
          path: xtrkcad-*-macos-${{ matrix.arch }}.tar.gz
          retention-days: 14

      - name: Build self-contained DMG
        # Skipped on normal pushes — opt in via workflow_dispatch input.
        # The DMG is unsigned; a volunteer with an Apple Developer account can
        # sign and notarize it. gtk-mac-bundler is not a standard Homebrew
        # formula so this step may fail even when opted in.
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.include_dmg == true }}
        continue-on-error: true
        run: |
          brew install gtk-mac-bundler || true
          cmake --install build --prefix bundle-staging
          cd distribution/osx/gtk-bundle
          bash xtrkcad-bundler.sh -i "${{ github.workspace }}/bundle-staging" \
            -v "${XTRKCAD_VERSION}"

      - name: Upload DMG (if built)
        uses: actions/upload-artifact@v7
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.include_dmg == true }}
        with:
          name: packages-macos-${{ matrix.arch }}-dmg
          path: "distribution/osx/gtk-bundle/xtrkcad-OSX-*.dmg"
          retention-days: 14

  # ── Windows x86-64 — ZIP (DLLs bundled) + NSIS installer ──────────────────
  package-windows:
    needs: [check-inputs]
    if: ${{ github.event_name != 'workflow_dispatch' || (inputs.windows && inputs.packages_from_run == '') }}
    runs-on: windows-2025
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pkg-config
            mingw-w64-x86_64-gtk3
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-libzip
            mingw-w64-x86_64-mxml
            mingw-w64-x86_64-librsvg
            mingw-w64-x86_64-gettext
            mingw-w64-x86_64-cmocka
            mingw-w64-x86_64-doxygen
            mingw-w64-x86_64-nsis
            git

      - uses: ./.github/actions/msys2-pin-gcc

      # ProgramVersion.cmake needs git to see the commit hash and the
      # v<version> tag. Without it a tagged release still installed under
      # the versioned name xtrkcad-<version> (Development Issues #48).
      # The checkout belongs to another Windows account than MSYS2's git
      # expects, so allow it explicitly.
      - name: Let MSYS2 git read the checkout
        run: |
          git config --global --add safe.directory '*'
          git describe --tags --always

      # MSYS2's doxygen package is rolling: 1.18.0-3 (landed between the
      # 2026-09-19 and 2026-10-05 runs) aborts on the User Guide build with
      # "terminate called after throwing an instance of 'std::system_error'
      # what(): Invalid argument". Pin the last version that built cleanly
      # here, the same way the Linux doxygen jobs pin theirs
      # (.github/actions/setup-doxygen).
      - name: Pin MSYS2 Doxygen package
        env:
          MSYS2_DOXYGEN_PKG_VERSION: 1.16.1-4
        run: |
          pacman -U --noconfirm "https://repo.msys2.org/mingw/mingw64/mingw-w64-x86_64-doxygen-${MSYS2_DOXYGEN_PKG_VERSION}-any.pkg.tar.zst"
          doxygen --version

      # ntldd collects the DLLs for the ZIP (below). Installed from its URL
      # rather than through setup-msys2: on 2026-10-25 MSYS2 changed the
      # ntldd-r19.7fb9365-4 entry in its package database without changing
      # the version, so the runner image's database expected a different
      # signature and pacman rejected the download as corrupted. pacman -U
      # checks the file against its own .sig instead.
      - name: Install ntldd
        env:
          MSYS2_NTLDD_PKG: mingw-w64-x86_64-ntldd-r19.7fb9365-4-any.pkg.tar.zst
        run: |
          pacman -U --noconfirm "https://repo.msys2.org/mingw/mingw64/${MSYS2_NTLDD_PKG}"
          command -v ntldd

      - name: Get version
        run: |
          MAJOR=$(awk -F'"' '/set\(XTRKCAD_MAJOR_VERSION/{print $2; exit}' ProgramVersion.cmake)
          MINOR=$(awk -F'"' '/set\(XTRKCAD_MINOR_VERSION/{print $2; exit}' ProgramVersion.cmake)
          PATCH=$(awk -F'"' '/set\(XTRKCAD_RELEASE_VERSION/{print $2; exit}' ProgramVersion.cmake)
          MODIFIER=$(awk -F'"' '/set\(XTRKCAD_VERSION_MODIFIER/{print $2; exit}' ProgramVersion.cmake)
          echo "XTRKCAD_VERSION=${MAJOR}.${MINOR}.${PATCH}${MODIFIER}" >> "$GITHUB_ENV"

      - name: Configure (Release)
        run: |
          set -o pipefail
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DXTRKCAD_TESTING=ON \
            -DXTRKCAD_USE_GETTEXT=OFF | tee configure.log
          # A release tag must give the unversioned install name.
          if [ "${{ github.ref_type }}" = tag ]; then
            grep -q 'install identity: xtrkcad (' configure.log ||
              { echo "::error::tagged build did not configure an unversioned install"; exit 1; }
          fi

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Install to staging directory
        run: cmake --install build --prefix "$(pwd)/staging"

      - name: Collect GTK3 runtime DLLs
        # Copy the GTK3 runtime data (pixbuf loaders, GSettings schemas, icon
        # theme), then every MinGW64 DLL the binary or a loader needs.
        # Errors fail the step: until 2026-10-24 this used
        # `xargs cp ... || true`, xargs ate the backslashes in ntldd's
        # Windows paths, every copy failed silently, and no ZIP ever
        # shipped a DLL (found by install-test-windows).
        run: |
          set -eo pipefail
          STAGING="$(pwd)/staging"
          # xtrkcad-<version>.exe, or plain xtrkcad.exe on a tagged release
          # (unversioned install, XTRKCAD_VERSIONED_INSTALL).
          set -- "$STAGING"/bin/xtrkcad*.exe
          [ $# -eq 1 ] && [ -f "$1" ] || { echo "::error::expected one xtrkcad binary in bin/, found: $*"; exit 1; }
          BINARY=$1
          MINGW=/mingw64

          # GTK3 pixbuf loaders (needed for SVG icons and PNG images)
          GDK_VER=$(ls $MINGW/lib/gdk-pixbuf-2.0/)
          LOADERS="$STAGING/lib/gdk-pixbuf-2.0/$GDK_VER/loaders"
          mkdir -p "$LOADERS"
          cp "$MINGW/lib/gdk-pixbuf-2.0/$GDK_VER/loaders.cache" \
             "$STAGING/lib/gdk-pixbuf-2.0/$GDK_VER/"
          cp "$MINGW/lib/gdk-pixbuf-2.0/$GDK_VER/loaders/"*.dll "$LOADERS/"

          # GSettings compiled schemas (required by GTK3 on Windows)
          mkdir -p "$STAGING/share/glib-2.0/schemas"
          cp "$MINGW/share/glib-2.0/schemas/gschemas.compiled" \
             "$STAGING/share/glib-2.0/schemas/"

          # Hicolor icon theme (GTK3 fallback icons)
          mkdir -p "$STAGING/share/icons"
          cp -r "$MINGW/share/icons/hicolor" "$STAGING/share/icons/"

          # DLL dependencies of the binary and the loaders, MinGW64 only.
          # ntldd prints "name => D:\...\mingw64\bin\name.dll (0x...)";
          # cygpath turns the Windows path into one cp can use.
          ntldd -R "$BINARY" "$LOADERS"/*.dll \
            | awk '$3 ~ /[\\\/]mingw64[\\\/]/ {print $3}' \
            | cygpath -u -f - | sort -u > dlls.txt
          [ -s dlls.txt ] || { echo "::error::ntldd found no MinGW64 DLLs"; exit 1; }
          while IFS= read -r dll; do
            cp -n "$dll" "$STAGING/bin/"
          done < dlls.txt
          echo "copied $(wc -l < dlls.txt) DLLs into bin/"

      - name: Create ZIP archive
        run: |
          cd staging
          cmake -E tar cf "../xtrkcad-${XTRKCAD_VERSION}-windows-x64.zip" \
            --format=zip .

      - name: Upload ZIP
        uses: actions/upload-artifact@v7
        with:
          name: packages-windows-x64-zip
          path: xtrkcad-*-windows-x64.zip
          retention-days: 14

      - name: Package NSIS installer
        # Built on version tags, and on request (include_nsis) otherwise.
        # cmake --install doesn't collect the MinGW DLLs (the step above
        # does, into staging/), so the installer is built from staging/ as
        # well: CPACK_INSTALLED_DIRECTORIES adds it to what CPack installs
        # from the build, and the installer ends up holding the same files
        # as the ZIP (Development Issues #49).
        if: ${{ github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.include_nsis == true) }}
        run: |
          STAGING=$(cygpath -m "$(pwd)/staging")
          cd build
          cpack -G NSIS -D "CPACK_INSTALLED_DIRECTORIES=$STAGING;."
          ls -l xtrkcad-setup-*.exe

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v7
        if: ${{ github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.include_nsis == true) }}
        with:
          name: packages-windows-x64-nsis
          path: build/xtrkcad-setup-*.exe
          if-no-files-found: error
          retention-days: 14

  # ── Install tests — Linux packages on clean systems ───────────────────────
  # Installs each Linux package in a fresh container of the release it's
  # for, with that release's own package manager, and runs
  # tools/package-install-test.sh: dependencies resolve, the binary runs and
  # plays demos from the installed data, removal is clean. Until these
  # existed, no CI job ever installed a package.
  #
  # They don't hold back latest-main, but github-release needs them, so a
  # release is only drafted when every install test passed (Development
  # Issues #48).
  install-test-linux:
    name: install-test-linux (${{ matrix.target }}, ${{ matrix.arch }})
    needs: [check-inputs, package-linux-ubuntu, package-linux-debian, package-linux-fedora]
    if: ${{ !cancelled() && needs.check-inputs.result == 'success' && (github.event_name != 'workflow_dispatch' || inputs.linux) }}
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - {target: ubuntu2404, arch: amd64, image: 'ubuntu:24.04', package: '*-ubuntu2404.deb', artifact: packages-linux-ubuntu2404-amd64}
          - {target: ubuntu2404, arch: arm64, image: 'ubuntu:24.04', package: '*-ubuntu2404.deb', artifact: packages-linux-ubuntu2404-arm64}
          - {target: ubuntu2604, arch: amd64, image: 'ubuntu:26.04', package: '*-ubuntu2604.deb', artifact: packages-linux-ubuntu2604-amd64}
          - {target: ubuntu2604, arch: arm64, image: 'ubuntu:26.04', package: '*-ubuntu2604.deb', artifact: packages-linux-ubuntu2604-arm64}
          - {target: debian12, arch: amd64, image: 'debian:bookworm', package: '*-debian12.deb', artifact: packages-linux-debian12-amd64}
          - {target: debian12, arch: arm64, image: 'debian:bookworm', package: '*-debian12.deb', artifact: packages-linux-debian12-arm64}
          - {target: debian13, arch: amd64, image: 'debian:trixie', package: '*-debian13.deb', artifact: packages-linux-debian13-amd64}
          - {target: debian13, arch: arm64, image: 'debian:trixie', package: '*-debian13.deb', artifact: packages-linux-debian13-arm64}
          - {target: fedora44, arch: amd64, image: 'fedora:44', package: '*-fedora44.rpm', artifact: packages-linux-fedora44-amd64, options: --privileged}
          - {target: fedora44, arch: arm64, image: 'fedora:44', package: '*-fedora44.rpm', artifact: packages-linux-fedora44-arm64, options: --privileged}
          - {target: fedora45, arch: amd64, image: 'fedora:45', package: '*-fedora45.rpm', artifact: packages-linux-fedora45-amd64, options: --privileged}
          - {target: fedora45, arch: arm64, image: 'fedora:45', package: '*-fedora45.rpm', artifact: packages-linux-fedora45-arm64, options: --privileged}
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    # options: Fedora needs --privileged for glycin's bwrap sandbox, see
    # package-linux-fedora.
    container:
      image: ${{ matrix.image }}
      options: ${{ matrix.options || '' }}
    steps:
      - uses: actions/checkout@v7

      - name: Download package
        uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.artifact }}
          path: pkg
          # packages_from_run: that run's artifacts (needs the token);
          # otherwise this run's.
          run-id: ${{ inputs.packages_from_run || github.run_id }}
          github-token: ${{ inputs.packages_from_run && github.token || '' }}

      - name: Install test
        env:
          PATTERN: ${{ matrix.package }}
        run: |
          # shellcheck disable=SC2086 # PATTERN is a glob
          set -- pkg/$PATTERN
          [ $# -eq 1 ] && [ -f "$1" ] || { echo "expected one $PATTERN in pkg/, found: $*"; exit 1; }
          sh tools/package-install-test.sh "$1"

  # ── Install test — Windows ZIP on a clean runner ──────────────────────────
  # Unpacks the ZIP into a path with a space in it and runs
  # tools/package-install-test-windows.ps1 with only the Windows system
  # directories on PATH, so a DLL the package forgot can't be found in the
  # runner's MSYS2, Git or Perl. Like install-test-linux, it gates
  # github-release but not latest-main.
  install-test-windows:
    needs: [check-inputs, package-windows]
    if: ${{ !cancelled() && needs.check-inputs.result == 'success' && (github.event_name != 'workflow_dispatch' || inputs.windows) }}
    permissions:
      actions: read
      contents: read
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7

      - name: Download package
        uses: actions/download-artifact@v8
        with:
          name: packages-windows-x64-zip
          path: pkg
          # packages_from_run: that run's artifacts (needs the token);
          # otherwise this run's.
          run-id: ${{ inputs.packages_from_run || github.run_id }}
          github-token: ${{ inputs.packages_from_run && github.token || '' }}

      - name: Install test
        shell: pwsh
        run: |
          $zips = @(Get-ChildItem pkg -Filter 'xtrkcad-*-windows-x64.zip')
          if ($zips.Count -ne 1) { throw "expected one ZIP in pkg/, found $($zips.Count)" }
          ./tools/package-install-test-windows.ps1 $zips[0].FullName -ArtifactDir "$env:RUNNER_TEMP/install-test-windows"

      - name: Upload screenshots of hung runs
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: install-test-windows-screenshots
          path: ${{ runner.temp }}/install-test-windows
          if-no-files-found: ignore
          retention-days: 14

  # ── Install test — Windows NSIS installer on a clean runner ───────────────
  # Runs only when the installer was built (tags, include_nsis).
  # tools/package-install-test-nsis.ps1 installs it silently into the
  # default Program Files folder, runs the ZIP test's checks on the
  # installed tree, checks the uninstall entry, Start menu shortcuts and
  # .xtc association, installs again over the first install (the upgrade
  # path, Development Issues #48), then uninstalls and checks nothing is
  # left behind.
  install-test-windows-nsis:
    needs: [check-inputs, package-windows]
    if: ${{ !cancelled() && needs.check-inputs.result == 'success' && (github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.windows && inputs.include_nsis)) }}
    permissions:
      actions: read
      contents: read
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7

      - name: Download installer
        uses: actions/download-artifact@v8
        with:
          name: packages-windows-x64-nsis
          path: pkg
          # packages_from_run: that run's artifacts (needs the token);
          # otherwise this run's.
          run-id: ${{ inputs.packages_from_run || github.run_id }}
          github-token: ${{ inputs.packages_from_run && github.token || '' }}

      - name: Install test
        shell: pwsh
        run: |
          $exes = @(Get-ChildItem pkg -Filter 'xtrkcad-setup-*.exe')
          if ($exes.Count -ne 1) { throw "expected one installer in pkg/, found $($exes.Count)" }
          ./tools/package-install-test-nsis.ps1 $exes[0].FullName -ArtifactDir "$env:RUNNER_TEMP/install-test-windows-nsis"

      - name: Upload screenshots of hung runs
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: install-test-windows-nsis-screenshots
          path: ${{ runner.temp }}/install-test-windows-nsis
          if-no-files-found: ignore
          retention-days: 14

  # ── Install tests — macOS archives on clean runners ───────────────────────
  # Follows README-INSTALL.txt on a fresh runner of each architecture
  # (brew install the prerequisites, unpack, run by full path from $HOME)
  # with tools/package-install-test-macos.sh. Like install-test-linux, it
  # gates github-release but not latest-main.
  install-test-macos:
    name: install-test-macos (${{ matrix.arch }})
    needs: [check-inputs, package-macos]
    if: ${{ !cancelled() && needs.check-inputs.result == 'success' && (github.event_name != 'workflow_dispatch' || inputs.macos) }}
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-26
          - arch: x86_64
            runner: macos-26-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Download package
        uses: actions/download-artifact@v8
        with:
          name: packages-macos-${{ matrix.arch }}
          path: pkg
          # packages_from_run: that run's artifacts (needs the token);
          # otherwise this run's.
          run-id: ${{ inputs.packages_from_run || github.run_id }}
          github-token: ${{ inputs.packages_from_run && github.token || '' }}

      - name: Install test
        run: |
          set -- pkg/xtrkcad-*-macos-${{ matrix.arch }}.tar.gz
          [ $# -eq 1 ] && [ -f "$1" ] || { echo "expected one archive in pkg/, found: $*"; exit 1; }
          sh tools/package-install-test-macos.sh "$1"

  # ── Analysis reports for GitHub Pages ─────────────────────────────────────
  # coverage, cppcheck-deep, clang-tidy, codespell and compiler-warnings as
  # xtrkcad-<tool>-html artifacts, from the same job definitions ci-gtk3.yml
  # runs on every PR (gtk3-qa-reports.yml). deploy-pages unpacks them.
  qa-reports:
    needs: [check-inputs]
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.packages_from_run == '' }}
    uses: ./.github/workflows/gtk3-qa-reports.yml
    with:
      html: true

  package-suppress-inventory:
    needs: [check-inputs]
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.packages_from_run == '' }}
    # Inventory of every cppcheck-suppress/NOLINT(NEXTLINE) comment in
    # app/bin (+ app/wlib/gtk3lib, added 2026-09-02 once cppcheck's own
    # scope widened there -- see tools/scan-suppressions.sh's usage
    # comment for why each root is scanned non-recursively), split into
    # boilerplate (generic "confirmed via broad sampling" reasoning from
    # a prior bulk-approval pass) vs. specific (individualized reasoning)
    # vs. unreasoned (no reason found at all, checking inline "-- reason"
    # text, a same-line trailing block comment, and comment lines
    # immediately following the suppress line).
    # A boilerplate suppress is the one most likely to be hiding a fully
    # removable case -- see SF #749's ccornu.c `ep` discovery, found only
    # because that one happened to get individually re-traced. Answers
    # "are we actually done re-auditing, or did we just stop finding
    # things" without re-deriving the count by hand each time.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Scan for suppress comments
        run: tools/scan-suppressions.sh app/bin app/wlib/gtk3lib app/wlib/gtk3lib/unix > suppressions.txt
      - name: Format as HTML
        run: |
          mkdir -p report
          tools/format-findings-report.sh suppressions.txt report/index.html \
            "Suppress inventory" bracketed \
            "${{ github.server_url }}/${{ github.repository }}/blob/${{ github.sha }}/"
      - name: Archive report
        run: tar -czf xtrkcad-suppress-inventory.tar.gz -C report .
      - name: Upload report
        uses: actions/upload-artifact@v7
        with:
          name: xtrkcad-suppress-inventory-html
          path: xtrkcad-suppress-inventory.tar.gz
          retention-days: 14

  # ── Doxygen documentation — built and uploaded on every push ──────────────
  # Gives a browsable "latest docs" artifact without waiting for a version
  # tag or for the Hg bug branches behind any given doc change to clear
  # their SF review window and merge into main -- this job tracks
  # whatever's on the git mirror right now.
  package-docs:
    needs: [check-inputs]
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.packages_from_run == '' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/apt-deps

      - uses: ./.github/actions/setup-doxygen

      - name: Configure
        # XTRKCAD_USERGUIDE_URL overrides the dev guide's default (relative,
        # same-build-tree) User Guide link with the real absolute URL this
        # job's own Pages deployment below puts it at -- computed from this
        # run's own repository context, not a hardcoded site/account, so it's
        # correct for whichever fork's Actions is doing the deploying.
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DXTRKCAD_USE_DOXYGEN=ON -DXTRKCAD_TESTING=OFF \
            -DXTRKCAD_USERGUIDE_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/userguide/"

      - name: Build docs
        run: cmake --build build --target docs-doxygen

      - name: Archive docs
        run: tar -czf xtrkcad-docs.tar.gz -C build/docs/doxygen/html .

      - name: Upload docs
        uses: actions/upload-artifact@v7
        with:
          name: xtrkcad-docs-html
          path: xtrkcad-docs.tar.gz
          retention-days: 14

      - name: Build user guide
        # help-html (app/doc/CMakeLists.txt) is normally part of the default
        # 'all' target, but this job only builds docs-doxygen above, so it
        # still needs building explicitly here (cmake resolves its
        # msgfiles/Doxygen dependencies automatically). Real Doxygen-based
        # build as of the Halibut -> Doxygen conversion (SF feature-requests
        # #219, see .claude/halibut-doxygen-investigation-plan.md) -- no
        # longer a CI-test-only step, no longer needs tools/but-to-doxygen.py
        # (that was one-time bootstrap tooling; its output is now the
        # committed source in app/doc/*.dox).
        run: cmake --build build --target help-html

      - name: Archive user guide
        run: tar -czf xtrkcad-userguide.tar.gz -C build/app/doc/html .

      - name: Upload user guide
        uses: actions/upload-artifact@v7
        with:
          name: xtrkcad-userguide-html
          path: xtrkcad-userguide.tar.gz
          retention-days: 14

  # ── GitHub Pages — Doxygen + user guide, redeployed on every push ─────────
  # Gives stable, permanent URLs that always reflect the latest successful
  # build, unlike the 14-day artifacts above (whose links change every run):
  #   https://<owner>.github.io/<repo>/doxygen/
  #   https://<owner>.github.io/<repo>/userguide/
  # (<owner>/<repo> being whichever fork's Actions is doing the deploying.)
  deploy-pages:
    needs:
      - package-docs
      - qa-reports
      - package-suppress-inventory
    # Only ordinary main pushes redeploy the live public site -- this
    # job previously had no such guard despite this file's own header
    # comment claiming one (found 2026-08-05 while wiring up the new
    # package-* report jobs, needed a way to workflow_dispatch-test them
    # without publishing untested branch content live). Matches
    # publish-latest-release's existing guard below.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
      actions: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Remove stale github-pages artifacts from earlier attempts
        # actions/deploy-pages fetches the run's "github-pages" artifact by
        # name and errors out ("Multiple artifacts named github-pages were
        # unexpectedly found") if more than one exists. That happens
        # whenever this job is re-run after a previous attempt already got
        # as far as "Upload Pages artifact" -- e.g. attempt 1 uploads fine
        # but then times out on GitHub's Pages backend (deployment_queued),
        # and a re-run of just this job uploads a second one. Artifacts
        # aren't cleaned up between attempts of the same run, so clear any
        # pre-existing ones before uploading a fresh copy (found 2026-08-06,
        # run 31105550052).
        run: |
          gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" \
            --paginate --jq '.artifacts[] | select(.name=="github-pages") | .id' |
          while read -r id; do
            echo "Deleting stale github-pages artifact $id"
            gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id"
          done
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Download docs artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: 'xtrkcad-*-html'
          path: downloaded

      - name: Assemble Pages site
        run: |
          mkdir -p site/doxygen site/userguide site/coverage site/cppcheck-deep site/clang-tidy site/codespell site/compiler-warnings site/suppress-inventory
          tar -xzf downloaded/xtrkcad-docs-html/xtrkcad-docs.tar.gz -C site/doxygen
          tar -xzf downloaded/xtrkcad-userguide-html/xtrkcad-userguide.tar.gz -C site/userguide
          tar -xzf downloaded/xtrkcad-coverage-html/xtrkcad-coverage.tar.gz -C site/coverage
          tar -xzf downloaded/xtrkcad-cppcheck-deep-html/xtrkcad-cppcheck-deep.tar.gz -C site/cppcheck-deep
          tar -xzf downloaded/xtrkcad-clang-tidy-html/xtrkcad-clang-tidy.tar.gz -C site/clang-tidy
          tar -xzf downloaded/xtrkcad-codespell-html/xtrkcad-codespell.tar.gz -C site/codespell
          tar -xzf downloaded/xtrkcad-compiler-warnings-html/xtrkcad-compiler-warnings.tar.gz -C site/compiler-warnings
          tar -xzf downloaded/xtrkcad-suppress-inventory-html/xtrkcad-suppress-inventory.tar.gz -C site/suppress-inventory
          cat > site/index.html <<'PAGEEOF'
          <!doctype html>
          <html lang="en">
          <head><meta charset="utf-8"><title>XTrkCAD — Latest Docs</title></head>
          <body>
          <h1>XTrkCAD — Latest Documentation</h1>
          <p>Redeployed automatically on every successful push to main.</p>
          <ul>
            <li><a href="doxygen/">Developer documentation (Doxygen)</a></li>
            <li><a href="userguide/">User guide</a></li>
            <li><a href="${{ github.server_url }}/${{ github.repository }}/releases/tag/latest-main">Latest development build (packages)</a></li>
          </ul>
          <h2>Analysis reports</h2>
          <p>Report-only, non-gating -- findings backlogs, not build failures. Each link back to the
          exact commit's source on GitHub.</p>
          <ul>
            <li><a href="coverage/">Code coverage</a> (unit tests + full regression suite, branch coverage)</li>
            <li><a href="cppcheck-deep/">cppcheck (deep)</a></li>
            <li><a href="clang-tidy/">clang-tidy</a></li>
            <li><a href="codespell/">codespell</a></li>
            <li><a href="compiler-warnings/">Compiler warnings</a> (-Wall -Wextra, Linux)</li>
            <li><a href="suppress-inventory/">Suppress inventory</a> (cppcheck-suppress/NOLINT comments, boilerplate vs. specific reasoning)</li>
          </ul>
          </body>
          </html>
          PAGEEOF

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # ── "Latest" GitHub Release — rolling, tracks the newest main push ──
  # Unlike the artifacts above, this is one permanent, unchanging URL:
  #   <server>/<owner>/<repo>/releases/tag/latest-main
  # Only runs on ordinary main pushes: version tags get their own
  # permanent release via github-release below, and workflow_dispatch runs
  # (which may opt into experimental NSIS/DMG builds) are excluded so those
  # can't silently replace the normal rolling-release assets.
  publish-latest-release:
    needs: [package-linux-ubuntu, package-linux-debian, package-linux-fedora, package-macos, package-windows]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    concurrency:
      group: latest-main-release
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download all packages
        uses: actions/download-artifact@v8
        with:
          path: release-packages
          merge-multiple: true

      - name: Remove GitHub Pages deployment bundle
        # actions/upload-pages-artifact (used by deploy-pages) also uploads a
        # regular workflow artifact named "github-pages" whose file is always
        # called artifact.tar — an opaque tarball of the whole Pages site,
        # not a real package. With no name filter above, download-artifact
        # pulls it in alongside the real packages; strip it out explicitly
        # rather than relying on glob-pattern filtering syntax.
        run: rm -f release-packages/artifact.tar

      - name: List packages
        run: find release-packages -type f | sort

      - name: Update rolling 'latest-main' release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t FILES < <(find release-packages -type f | sort)
          gh release delete latest-main --yes --cleanup-tag || true
          gh release create latest-main \
            --title "Latest Development Build" \
            --target "${{ github.sha }}" \
            --notes "$(printf '%s\n' \
              '**Automatically updated on every successful push to main.**' \
              '' \
              'This is an unstable development build, not a tagged release — for' \
              "production use, see the [tagged releases](${{ github.server_url }}/${{ github.repository }}/releases)." \
              '' \
              "Built from commit ${{ github.sha }}." \
              '' \
              "[Doxygen developer docs](https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/doxygen/) · [User guide](https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/userguide/)")" \
            --prerelease \
            --latest=false \
            "${FILES[@]}"

  # ── Temporary review-branch release — opt-in via workflow_dispatch ────────
  # For review branches not going into main yet (e.g. a large,
  # one-way removal like the Halibut -> Doxygen migration) but where
  # reviewers want real installable packages, not just a source checkout.
  # Explicit opt-in only (publish_temp_release input, default false) so an
  # ordinary CI-proving workflow_dispatch run never publishes anything.
  # Tag is branch-derived and deleted+recreated on every dispatch (same
  # rolling pattern as publish-latest-release above), so re-running updates
  # it in place instead of accumulating releases. This is NOT a substitute
  # for the real latest-main rolling release or a tagged release --
  # delete the tag once the branch merges or is abandoned (github-release
  # and publish-latest-release are both unaffected by this job).
  publish-temp-release:
    needs: [package-linux-ubuntu, package-linux-debian, package-linux-fedora, package-macos, package-windows]
    if: github.event_name == 'workflow_dispatch' && inputs.publish_temp_release == true
    runs-on: ubuntu-24.04
    concurrency:
      group: temp-release-${{ github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download all packages
        uses: actions/download-artifact@v8
        with:
          path: release-packages
          merge-multiple: true

      - name: Remove GitHub Pages deployment bundle
        # See publish-latest-release's identical step above for why.
        run: rm -f release-packages/artifact.tar

      - name: List packages
        run: find release-packages -type f | sort

      - name: Compute temp release tag
        run: |
          # GitHub tag/release names are more permissive than this needs to
          # be strict about -- branch names here are already tag-safe, but
          # sanitize defensively (slashes are the one real risk, e.g. a
          # future user/foo-branch).
          SAFE_REF="$(echo '${{ github.ref_name }}' | tr '/' '-')"
          echo "TEMP_TAG=temp-${SAFE_REF}" >> "$GITHUB_ENV"

      - name: Update the temporary release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t FILES < <(find release-packages -type f | sort)
          gh release delete "$TEMP_TAG" --yes --cleanup-tag || true
          gh release create "$TEMP_TAG" \
            --title "TEMP — ${{ github.ref_name }} (review build, not for production)" \
            --target "${{ github.sha }}" \
            --notes "$(printf '%s\n' \
              '**Temporary review build — not a real release.**' \
              '' \
              "Branch \`${{ github.ref_name }}\`, commit ${{ github.sha }}." \
              'This tag is deleted and recreated on every dispatch of this workflow' \
              'for this branch, and should itself be deleted once the branch merges' \
              'or is abandoned. Not linked from anywhere permanent.')" \
            --prerelease \
            --latest=false \
            "${FILES[@]}"

  # ── Release tag check — only on version tags ──────────────────────────────
  # The tag must name the version ProgramVersion.cmake builds: v<version>
  # for a release, or v<version>-<suffix> (e.g. v5.4.0-test1) for a trial
  # run, which github-release publishes as a prerelease. Without this, a
  # tag v5.4.1 on a commit still at 5.4.0 drafted "XTrkCAD v5.4.1" with
  # 5.4.0 packages (Development Issues #48).
  check-release-tag:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Tag matches ProgramVersion.cmake
        run: |
          MAJOR=$(awk -F'"' '/set\(XTRKCAD_MAJOR_VERSION/{print $2; exit}' ProgramVersion.cmake)
          MINOR=$(awk -F'"' '/set\(XTRKCAD_MINOR_VERSION/{print $2; exit}' ProgramVersion.cmake)
          PATCH=$(awk -F'"' '/set\(XTRKCAD_RELEASE_VERSION/{print $2; exit}' ProgramVersion.cmake)
          MODIFIER=$(awk -F'"' '/set\(XTRKCAD_VERSION_MODIFIER/{print $2; exit}' ProgramVersion.cmake)
          VERSION="${MAJOR}.${MINOR}.${PATCH}${MODIFIER}"
          TAG="${{ github.ref_name }}"
          case "$TAG" in
          "v$VERSION") echo "release tag $TAG" ;;
          "v$VERSION"-*) echo "trial tag $TAG, will publish as a prerelease" ;;
          *)
            echo "::error::tag $TAG does not match ProgramVersion.cmake ($VERSION): use v$VERSION, or v$VERSION-<suffix> for a trial"
            exit 1
            ;;
          esac

  # ── GitHub Release — created only on version tags ──────────────────────────
  # Waits for the install tests as well as the packages: a release is only
  # drafted from packages that installed and ran on clean systems.
  github-release:
    needs: [check-release-tag, package-linux-ubuntu, package-linux-debian, package-linux-fedora, package-macos, package-windows, package-docs, install-test-linux, install-test-windows, install-test-windows-nsis, install-test-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download all packages
        uses: actions/download-artifact@v8
        with:
          path: release-packages
          merge-multiple: true

      - name: Remove GitHub Pages deployment bundle
        # See the same step in publish-latest-release above — the
        # deploy-pages job's artifact isn't a real package.
        run: rm -f release-packages/artifact.tar

      - name: List packages
        run: find release-packages -type f | sort

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          # A suffixed tag (v5.4.0-test1) is a trial run, checked by
          # check-release-tag: mark it a prerelease.
          PRERELEASE=()
          case "$TAG" in *-*) PRERELEASE=(--prerelease --latest=false) ;; esac
          # Flatten all artifact subdirectories into a single file list
          mapfile -t FILES < <(find release-packages -type f | sort)
          gh release create "$TAG" \
            --title "XTrkCAD ${TAG}" \
            --generate-notes \
            --draft \
            "${PRERELEASE[@]}" \
            "${FILES[@]}"
