name: Pin MinGW GCC (MSYS2)
description: >-
  Installs an exact MSYS2 MINGW64 gcc/gcc-libs pair with pacman -U, the same
  way release.yml pins MSYS2 doxygen, so new GCC warnings only arrive when we
  bump the version. The default here is the one place the Windows jobs' GCC
  version is set. Run after msys2/setup-msys2.
inputs:
  version:
    description: MSYS2 package version (pkgver-pkgrel), e.g. 16.2.0-6.
    default: '16.2.0-6'
runs:
  using: composite
  steps:
    - name: Pin MinGW GCC ${{ inputs.version }}
      shell: msys2 {0}
      env:
        MSYS2_GCC_PKG_VERSION: ${{ inputs.version }}
      run: |
        pacman -U --noconfirm \
          "https://repo.msys2.org/mingw/mingw64/mingw-w64-x86_64-gcc-libs-${MSYS2_GCC_PKG_VERSION}-any.pkg.tar.zst" \
          "https://repo.msys2.org/mingw/mingw64/mingw-w64-x86_64-gcc-${MSYS2_GCC_PKG_VERSION}-any.pkg.tar.zst"
        gcc --version | head -1
