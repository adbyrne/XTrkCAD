name: Packages (Windows)

# Reusable workflow, called by release.yml: builds the Windows x64 ZIP
# (packages-windows-x64<suffix>-zip artifact of the calling run) and, with
# include_nsis, the NSIS installer (packages-windows-x64<suffix>-nsis).
# release.yml asks for the installer on version tags and on request.
#
# Two variants (Development Issues #34), built from the same source:
#   MINGW64  the standard package, file names without a suffix
#   UCRT64   the same program linked against Microsoft's Universal C
#            Runtime, file names ending in -ucrt
# MSYS2 deprecates MINGW64, but the Windows developers want to keep it until
# after the 5.4.0 release; many users run older Windows versions.
#
# Runners and compilers are pinned as in ci-gtk3.yml (see its header):
# ubuntu-24.04(-arm), ubuntu-26.04(-arm) for the Ubuntu 26.04 DEB, macos-26
# and macos-26-intel with .github/actions/select-xcode, windows-2025 with
# .github/actions/msys2-pin-gcc.

on:
  workflow_call:
    inputs:
      include_nsis:
        description: Also build the NSIS installer.
        type: boolean
        default: false

jobs:
  # ── Windows x86-64 — ZIP (DLLs bundled) + NSIS installer ──────────────────
  package-windows:
    name: package-windows (${{ matrix.msystem }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - msystem: MINGW64
            suffix: ''
          - msystem: UCRT64
            suffix: -ucrt
    runs-on: windows-2025
    env:
      PKG_SUFFIX: ${{ matrix.suffix }}
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7

      - uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: false
          # pacboy's ":p" adds the environment's package prefix
          # (mingw-w64-x86_64-*, mingw-w64-ucrt-x86_64-*).
          pacboy: >-
            gcc:p
            cmake:p
            ninja:p
            pkg-config:p
            gtk3:p
            zlib:p
            libzip:p
            mxml:p
            librsvg:p
            gettext:p
            cmocka:p
            doxygen:p
            nsis:p
          install: git

      - uses: ./.github/actions/msys2-pin-gcc

      # ProgramVersion.cmake needs git to see the commit hash and the
      # v<version> tag. Without it a tagged release still installed under
      # the versioned name xtrkcad-<version> (Development Issues #48).
      # The checkout belongs to another Windows account than MSYS2's git
      # expects, so allow it explicitly.
      - name: Let MSYS2 git read the checkout
        run: |
          git config --global --add safe.directory '*'
          git describe --tags --always

      # MSYS2's doxygen package is rolling: 1.18.0-3 (landed between the
      # 2026-09-19 and 2026-10-05 runs) aborts on the User Guide build with
      # "terminate called after throwing an instance of 'std::system_error'
      # what(): Invalid argument". Pin the last version that built cleanly
      # here, the same way the Linux doxygen jobs pin theirs
      # (.github/actions/setup-doxygen).
      - name: Pin MSYS2 Doxygen package
        env:
          MSYS2_DOXYGEN_PKG_VERSION: 1.16.1-4
        run: |
          pacman -U --noconfirm "https://repo.msys2.org/mingw/${MSYSTEM,,}/${MINGW_PACKAGE_PREFIX}-doxygen-${MSYS2_DOXYGEN_PKG_VERSION}-any.pkg.tar.zst"
          doxygen --version

      # ntldd collects the DLLs for the ZIP (below). Installed from its URL
      # rather than through setup-msys2: on 2026-10-25 MSYS2 changed the
      # ntldd-r19.7fb9365-4 entry in its package database without changing
      # the version, so the runner image's database expected a different
      # signature and pacman rejected the download as corrupted. pacman -U
      # checks the file against its own .sig instead.
      - name: Install ntldd
        env:
          MSYS2_NTLDD_PKG_VERSION: r19.7fb9365-4
        run: |
          pacman -U --noconfirm "https://repo.msys2.org/mingw/${MSYSTEM,,}/${MINGW_PACKAGE_PREFIX}-ntldd-${MSYS2_NTLDD_PKG_VERSION}-any.pkg.tar.zst"
          command -v ntldd

      - name: Get version
        run: |
          MAJOR=$(awk -F'"' '/set\(XTRKCAD_MAJOR_VERSION/{print $2; exit}' ProgramVersion.cmake)
          MINOR=$(awk -F'"' '/set\(XTRKCAD_MINOR_VERSION/{print $2; exit}' ProgramVersion.cmake)
          PATCH=$(awk -F'"' '/set\(XTRKCAD_RELEASE_VERSION/{print $2; exit}' ProgramVersion.cmake)
          MODIFIER=$(awk -F'"' '/set\(XTRKCAD_VERSION_MODIFIER/{print $2; exit}' ProgramVersion.cmake)
          echo "XTRKCAD_VERSION=${MAJOR}.${MINOR}.${PATCH}${MODIFIER}" >> "$GITHUB_ENV"

      - name: Configure (Release)
        run: |
          set -o pipefail
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DXTRKCAD_TESTING=ON \
            -DXTRKCAD_USE_GETTEXT=OFF | tee configure.log
          # A release tag must give the unversioned install name.
          if [ "${{ github.ref_type }}" = tag ]; then
            grep -q 'install identity: xtrkcad (' configure.log ||
              { echo "::error::tagged build did not configure an unversioned install"; exit 1; }
          fi

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Install to staging directory
        run: cmake --install build --prefix "$(pwd)/staging"

      - name: Collect GTK3 runtime DLLs
        # Copy the GTK3 runtime data (pixbuf loaders, GSettings schemas, icon
        # theme), then every DLL from the MSYS2 environment the binary or a
        # loader needs.
        # Errors fail the step: until 2026-10-24 this used
        # `xargs cp ... || true`, xargs ate the backslashes in ntldd's
        # Windows paths, every copy failed silently, and no ZIP ever
        # shipped a DLL (found by install-test-windows).
        run: |
          set -eo pipefail
          STAGING="$(pwd)/staging"
          # xtrkcad-<version>.exe, or plain xtrkcad.exe on a tagged release
          # (unversioned install, XTRKCAD_VERSIONED_INSTALL).
          set -- "$STAGING"/bin/xtrkcad*.exe
          [ $# -eq 1 ] && [ -f "$1" ] || { echo "::error::expected one xtrkcad binary in bin/, found: $*"; exit 1; }
          BINARY=$1
          MINGW=$MSYSTEM_PREFIX     # /mingw64 or /ucrt64
          ENVDIR=${MSYSTEM_PREFIX#/}

          # GTK3 pixbuf loaders (needed for SVG icons and PNG images)
          GDK_VER=$(ls $MINGW/lib/gdk-pixbuf-2.0/)
          LOADERS="$STAGING/lib/gdk-pixbuf-2.0/$GDK_VER/loaders"
          mkdir -p "$LOADERS"
          cp "$MINGW/lib/gdk-pixbuf-2.0/$GDK_VER/loaders.cache" \
             "$STAGING/lib/gdk-pixbuf-2.0/$GDK_VER/"
          cp "$MINGW/lib/gdk-pixbuf-2.0/$GDK_VER/loaders/"*.dll "$LOADERS/"

          # GSettings compiled schemas (required by GTK3 on Windows)
          mkdir -p "$STAGING/share/glib-2.0/schemas"
          cp "$MINGW/share/glib-2.0/schemas/gschemas.compiled" \
             "$STAGING/share/glib-2.0/schemas/"

          # Hicolor icon theme (GTK3 fallback icons)
          mkdir -p "$STAGING/share/icons"
          cp -r "$MINGW/share/icons/hicolor" "$STAGING/share/icons/"

          # DLL dependencies of the binary and the loaders, from this
          # environment only. ntldd prints
          # "name => D:\...\mingw64\bin\name.dll (0x...)" (ucrt64 for UCRT64);
          # cygpath turns the Windows path into one cp can use.
          ntldd -R "$BINARY" "$LOADERS"/*.dll \
            | awk -v env="$ENVDIR" '{ p = tolower($3); gsub(/\\/, "/", p) }
                p ~ ("/" env "/") {print $3}' \
            | cygpath -u -f - | sort -u > dlls.txt
          [ -s dlls.txt ] || { echo "::error::ntldd found no $MSYSTEM DLLs"; exit 1; }
          while IFS= read -r dll; do
            cp -n "$dll" "$STAGING/bin/"
          done < dlls.txt
          echo "copied $(wc -l < dlls.txt) DLLs into bin/"

      - name: Create ZIP archive
        run: |
          cd staging
          cmake -E tar cf "../xtrkcad-${XTRKCAD_VERSION}-windows-x64${PKG_SUFFIX}.zip" \
            --format=zip .

      - name: Upload ZIP
        uses: actions/upload-artifact@v7
        with:
          name: packages-windows-x64${{ matrix.suffix }}-zip
          path: xtrkcad-*-windows-x64${{ matrix.suffix }}.zip
          retention-days: 14

      - name: Package NSIS installer
        # Built on version tags, and on request (include_nsis) otherwise.
        # cmake --install doesn't collect the MinGW DLLs (the step above
        # does, into staging/), so the installer is built from staging/ as
        # well: CPACK_INSTALLED_DIRECTORIES adds it to what CPack installs
        # from the build, and the installer ends up holding the same files
        # as the ZIP (Development Issues #49).
        if: ${{ inputs.include_nsis }}
        run: |
          STAGING=$(cygpath -m "$(pwd)/staging")
          cd build
          cpack -G NSIS -D "CPACK_INSTALLED_DIRECTORIES=$STAGING;."
          # CPack names it xtrkcad-setup-<version>-x64.exe; the UCRT64
          # installer gets the -ucrt suffix like its ZIP. Both install into
          # the same XTrkCAD folder, so installing one replaces the other.
          set -- xtrkcad-setup-*.exe
          [ $# -eq 1 ] || { echo "::error::expected one installer, found: $*"; exit 1; }
          if [ -n "$PKG_SUFFIX" ]; then
            mv "$1" "${1%.exe}${PKG_SUFFIX}.exe"
          fi
          ls -l xtrkcad-setup-*.exe

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v7
        if: ${{ inputs.include_nsis }}
        with:
          name: packages-windows-x64${{ matrix.suffix }}-nsis
          path: build/xtrkcad-setup-*.exe
          if-no-files-found: error
          retention-days: 14
