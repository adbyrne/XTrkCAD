name: CI
on: [push]

jobs:
  mcp-tests:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - name: Run MCP tests
        working-directory: mcp
        run: uv run --extra dev pytest -q

  c-tests-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y cmake libgtk2.0-dev libcmocka-dev zlib1g-dev libzip-dev libmxml-dev librsvg2-bin
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug -DXTRKCAD_TESTING=ON
      - name: Build
        run: cmake --build build --parallel $(nproc)
      - name: Test
        run: ctest --test-dir build --output-on-failure

  c-tests-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        # mxml (Mini-XML) is not in homebrew-core; it is optional (SVG export only)
        run: brew install gtk+ cmocka libzip librsvg
      - name: Configure
        # CMAKE_PREFIX_PATH points CMake at Homebrew's prefix (/opt/homebrew on arm64)
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug -DXTRKCAD_TESTING=ON -DCMAKE_PREFIX_PATH="$(brew --prefix)"
      - name: Build
        run: cmake --build build --parallel $(sysctl -n hw.ncpu)
      - name: Test
        run: ctest --test-dir build --output-on-failure

  c-tests-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        # Windows uses mswlib (Win32) backend — no GTK; mxml is optional (SVG export)
        # FreeImage is required by CMake; pre-installed on Ubuntu runners but not Windows
        run: vcpkg install cmocka:x64-windows libzip:x64-windows freeimage:x64-windows
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug -DXTRKCAD_TESTING=ON "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
      - name: Build
        run: cmake --build build --config Debug --parallel
      - name: Test
        run: ctest --test-dir build -C Debug --output-on-failure
