name: CI (MCP)
on:
  push:
    branches:
      - main
      - test/**
    paths:
      - 'mcp/**'
      - '.github/workflows/ci-mcp.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'mcp/**'
      - '.github/workflows/ci-mcp.yml'

# MCP (mcp/) has its own workflow rather than a job in ci-gtk3.yml, so it
# keeps an independent CI status separate from the (much larger) C app suite.

jobs:
  mcp-tests:
    strategy:
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04, macos-26, windows-2025]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          # Pin the interpreter: uv otherwise picks the newest Python that
          # satisfies requires-python, and macos-latest moved to 3.15, which
          # rpds-py (via PyO3, max 3.14) can't build for (2026-10-18).
          python-version: "3.14"
      - name: Run MCP tests
        working-directory: mcp
        run: uv run --extra dev pytest -q
