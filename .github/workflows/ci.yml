name: CI
on:
  push:
    branches:
      - main
      - test/**
  pull_request:
    branches:
      - main

jobs:
  doxygen:
    # Doxygen is pinned to DOXYGEN_VERSION (official prebuilt Linux binary,
    # not the apt package) rather than left to whatever Ubuntu's repo
    # resolves to -- avoids the kind of silent tool drift astyle hit in SF
    # #638. Ubuntu 24.04 ships 1.9.8; Ubuntu 26.04 already ships 1.15.0.
    #
    # docs/doxygen/Doxyfile.in was ported from Hg on 2026-07-16 to close a
    # git/Hg divergence (git's copy predated an upstream 2026-05-07 tightening
    # -- SF rev 6446/6432 -- and had separately drifted onto a different
    # Doxygen-version template). WARN_AS_ERROR is deliberately kept at NO
    # here even though Hg now sets FAIL_ON_WARNINGS: flipping it surfaces
    # ~435 pre-existing @param/return-type doc gaps that need their own
    # triage-or-suppress pass first, not a silent gate change bundled into
    # an unrelated CI-tooling PR.
    runs-on: ubuntu-latest
    env:
      DOXYGEN_VERSION: 1.9.8
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y cmake ninja-build libgtk2.0-dev graphviz zlib1g-dev libzip-dev
      - name: Install pinned Doxygen ${{ env.DOXYGEN_VERSION }}
        run: |
          curl -sL -o doxygen.tar.gz "https://github.com/doxygen/doxygen/releases/download/Release_${DOXYGEN_VERSION//./_}/doxygen-${DOXYGEN_VERSION}.linux.bin.tar.gz"
          tar xzf doxygen.tar.gz
          echo "$PWD/doxygen-${DOXYGEN_VERSION}/bin" >> "$GITHUB_PATH"
      - name: Configure
        run: |
          doxygen --version
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DXTRKCAD_USE_DOXYGEN=ON -DXTRKCAD_TESTING=OFF
      - name: Build docs
        run: cmake --build build --target docs-doxygen

  c-tests-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y cmake ninja-build libgtk2.0-dev libcmocka-dev zlib1g-dev libzip-dev libmxml-dev librsvg2-bin
      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DXTRKCAD_TESTING=ON
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  c-tests-arm64:
    # Native ARM64 runner — same architecture as Raspberry Pi 3/4/5
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y cmake ninja-build libgtk2.0-dev libcmocka-dev zlib1g-dev libzip-dev libmxml-dev librsvg2-bin
      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DXTRKCAD_TESTING=ON
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  c-tests-linux-clang:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y cmake ninja-build clang libgtk2.0-dev libcmocka-dev zlib1g-dev libzip-dev libmxml-dev librsvg2-bin
      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DXTRKCAD_TESTING=ON -DCMAKE_C_COMPILER=clang
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  c-tests-sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y cmake ninja-build clang libgtk2.0-dev libcmocka-dev zlib1g-dev libzip-dev libmxml-dev librsvg2-bin
      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DXTRKCAD_TESTING=ON -DXTRKCAD_SANITIZE=ON -DCMAKE_C_COMPILER=clang
      - name: Build
        run: cmake --build build
      - name: Test
        env:
          ASAN_OPTIONS: "abort_on_error=1:detect_leaks=1"
          UBSAN_OPTIONS: "abort_on_error=1:print_stacktrace=1"
        run: ctest --test-dir build --output-on-failure

  c-tests-valgrind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y cmake ninja-build libgtk2.0-dev libcmocka-dev zlib1g-dev libzip-dev libmxml-dev librsvg2-bin valgrind
      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DXTRKCAD_TESTING=ON
      - name: Build
        run: cmake --build build
      - name: Test under Valgrind
        run: |
          ctest --test-dir build --output-on-failure \
            -T memcheck \
            --overwrite MemoryCheckCommand=$(which valgrind) \
            --overwrite "MemoryCheckCommandOptions=--error-exitcode=1 --track-origins=yes --leak-check=full"

  cppcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install cppcheck
        run: sudo apt-get update -q && sudo apt-get install -y cppcheck
      - name: Run cppcheck
        run: |
          cppcheck \
            --error-exitcode=1 \
            --force \
            --suppress=missingInclude \
            --suppress=missingIncludeSystem \
            --suppress=normalCheckLevelMaxBranches \
            --suppress=nullPointerOutOfMemory \
            --suppress=nullPointerOutOfResources \
            --suppress=nullPointerArithmeticOutOfMemory \
            --suppress=syntaxError:app/bin/archive.c \
            --suppress=syntaxError:app/bin/cturntbl.c \
            --suppress=syntaxError:app/bin/directory.c \
            --suppress=syntaxError:app/bin/paths.c \
            --suppress=syntaxError:app/bin/utility.c \
            --suppress=unknownMacro:app/bin/custom.c \
            --suppress=ctunullpointer:app/bin/track.c \
            --suppress=uninitvar:app/bin/levenshtein.c \
            --suppress=uninitvar:app/bin/problemrep.c \
            --suppress=uninitvar:app/bin/paths.c \
            --suppress=nullPointer:app/bin/partcatalog.c \
            --suppress=missingReturn:app/bin/cturnout.c \
            --suppress=ctuPointerArith:app/bin/cturnout.c \
            -I app/bin -I app/bin/include -I app/wlib/include \
            app/bin/*.c app/dynstring/*.c

  compiler-warnings:
    # Report-only: captures -Wall -Wextra output as an artifact.
    # Does NOT fail the build — legacy code has pre-existing warnings.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y cmake ninja-build libgtk2.0-dev libcmocka-dev zlib1g-dev libzip-dev libmxml-dev librsvg2-bin
      - name: Configure with -Wall -Wextra
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DXTRKCAD_TESTING=ON \
            -DCMAKE_C_FLAGS="-Wall -Wextra -Wno-unused-parameter"
      - name: Build (warnings captured, non-fatal)
        run: cmake --build build 2>&1 | tee build/warnings.txt || true
      - name: Summarise warnings
        run: |
          COUNT=$(grep -c ': warning:' build/warnings.txt || echo 0)
          echo "Total warnings: $COUNT"
          echo ""
          echo "=== By warning flag ==="
          grep ': warning:' build/warnings.txt | grep -oE '\[-W[^]]+\]' | sort | uniq -c | sort -rn || true
          echo ""
          echo "=== By file (top 20) ==="
          grep ': warning:' build/warnings.txt | grep -oE '^[^:]+' | sed 's|.*/||' | sort | uniq -c | sort -rn | head -20 || true
      - name: Upload warning log
        uses: actions/upload-artifact@v7
        with:
          name: compiler-warnings-gtk2-linux
          path: build/warnings.txt

  coverage:
    # Report-only: generates an lcov HTML report and uploads it as an artifact.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y cmake ninja-build libgtk2.0-dev libcmocka-dev zlib1g-dev libzip-dev libmxml-dev librsvg2-bin lcov
      - name: Configure with coverage flags
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DXTRKCAD_TESTING=ON \
            -DCMAKE_C_FLAGS="--coverage" -DCMAKE_EXE_LINKER_FLAGS="--coverage"
      - name: Build
        run: cmake --build build
      - name: Run tests
        run: ctest --test-dir build --output-on-failure
      - name: Collect coverage
        run: |
          lcov --capture --directory build \
               --output-file build/coverage.info \
               --ignore-errors mismatch
          lcov --remove build/coverage.info \
               '/usr/*' '*/build/*' '*/unittest/*' '*/tools/*' \
               --output-file build/coverage-filtered.info \
               --ignore-errors unused
          genhtml build/coverage-filtered.info \
                  --output-directory build/coverage-html \
                  --title "XTrkCAD unit test coverage"
          lcov --summary build/coverage-filtered.info
      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report-gtk2
          path: build/coverage-html/

  c-tests-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        # mxml (Mini-XML) is not in homebrew-core; it is optional (SVG export only)
        run: brew install ninja gtk+ cmocka libzip librsvg
      - name: Configure
        # gtk+ and several of its deps (pango, atk, …) are keg-only in Homebrew
        # and are not symlinked into /opt/homebrew/lib.  Ask pkg-config for the
        # full set of -L flags so every keg's lib dir ends up on the linker path.
        run: |
          GTK_PREFIX=$(brew --prefix gtk+)
          export PKG_CONFIG_PATH="$GTK_PREFIX/lib/pkgconfig:$(brew --prefix)/lib/pkgconfig"
          GTK_LDFLAGS=$(pkg-config --libs-only-L gtk+-2.0)
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DXTRKCAD_TESTING=ON \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_PREFIX_PATH="$GTK_PREFIX;$(brew --prefix)" \
            -DCMAKE_EXE_LINKER_FLAGS="$GTK_LDFLAGS"
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  c-tests-windows:
    runs-on: windows-latest
    env:
      # Opt in early to Node.js 24 runtime for all actions in this job.
      # GitHub forces node24 on all runners after 2026-06-16; ilammy/msvc-dev-cmd@v1
      # declares node20 but is compatible — this verifies it before the forced cutover.
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v5
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Install rsvg-convert
        # rsvg-convert converts SVG toolbar icons to PNG during the build.
        # MSYS2 is pre-installed on Windows runners; mingw-w64-x86_64-librsvg
        # provides rsvg-convert.exe in C:\msys64\mingw64\bin.
        run: |
          C:\msys64\usr\bin\pacman.exe -Sq --noconfirm mingw-w64-x86_64-librsvg
          echo "C:\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Cache vcpkg packages
        uses: actions/cache@v5
        id: vcpkg-cache
        with:
          path: C:\vcpkg\installed
          key: vcpkg-x64-windows-cmocka-zlib-libzip-freeimage-v1
      - name: Install dependencies
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        # Windows uses mswlib (Win32) backend — no GTK; mxml is optional (SVG export)
        # FreeImage is required by CMake; pre-installed on Ubuntu runners but not Windows
        run: vcpkg install cmocka:x64-windows zlib:x64-windows libzip:x64-windows freeimage:x64-windows
      - name: Add vcpkg bin to PATH
        # pngtoxpm.exe loads FreeImage.dll (copied beside it at build time), but
        # FreeImage.dll's transitive vcpkg deps (libpng, libjpeg-turbo, zlib1, webp…)
        # are only in the vcpkg bin dir — not on PATH by default.  Add both release
        # and debug bin dirs so custom build commands and ctest can find all DLLs.
        run: |
          echo "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\debug\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Configure
        # CMAKE_PREFIX_PATH points CMake at the vcpkg installed tree so all
        # config-mode and module-mode finders (zlib, libzip, etc.) resolve.
        # Ninja is a single-config generator — CMAKE_BUILD_TYPE set at configure time.
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DXTRKCAD_TESTING=ON -DXTRKCAD_USE_GETTEXT=OFF "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" "-DCMAKE_PREFIX_PATH=$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows"
      - name: Build
        run: |
          cmake --build build 2>&1 | Tee-Object -FilePath build/build-log.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-build-log
          path: build/build-log.txt
      - name: Test
        run: ctest --test-dir build --output-on-failure
