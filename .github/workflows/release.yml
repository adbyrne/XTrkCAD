name: Release

# Builds Release packages on every push to main where the build and
# tests pass. Packages are uploaded as GitHub Actions artifacts (14-day
# retention) on every push. When a version tag (v*.*.*) is pushed, a
# permanent GitHub Release is also created with all packages attached,
# once the tag matches ProgramVersion.cmake and every install test passed
# (check-release-tag, github-release).
#
# Two more things happen on every ordinary main push (not on tags or
# workflow_dispatch), giving stable links that never expire or change:
#   - publish-latest-release rolls the packages into a single moving
#     "latest-main" GitHub Release (prerelease, not marked "Latest").
#   - deploy-pages redeploys Doxygen + the user guide to GitHub Pages.

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      publish_temp_release:
        description: 'Publish packages to a temporary, branch-named prerelease (for review branches — see publish-temp-release job)'
        type: boolean
        default: false
      include_nsis:
        description: 'Build and install-test the NSIS installer (always done on version tags)'
        type: boolean
        default: false
      include_dmg:
        description: 'Attempt self-contained DMG build (requires gtk-mac-bundler, may fail)'
        type: boolean
        default: false
      linux:
        description: 'Linux: build and install-test the DEB/RPM packages'
        type: boolean
        default: true
      windows:
        description: 'Windows: build and install-test the ZIP (and NSIS, if chosen)'
        type: boolean
        default: true
      macos:
        description: 'macOS: build and install-test the archives (and DMG, if chosen)'
        type: boolean
        default: true
      packages_from_run:
        description: 'Run ID of an earlier Release run: install-test its packages instead of building new ones (artifacts last 14 days)'
        type: string
        default: ''

# This file orchestrates; the work is in reusable workflows:
#   packages-linux.yml, packages-macos.yml, packages-windows.yml
#                         build each platform's packages (artifacts of this run)
#   install-tests.yml     installs them on clean systems, called once per
#                         platform (install-tests-only.yml reuses it when a
#                         test script changes)
#   gtk3-qa-reports.yml   the analysis reports, shared with ci-gtk3.yml
# Artifacts uploaded by a called workflow belong to this run, so the publish
# jobs below download them as before. Runners and compilers are pinned in
# the called workflows, the same way as ci-gtk3.yml.

jobs:
  # ── Dispatch inputs (Development Issues #59) ─────────────────────────────
  # linux/windows/macos choose the platforms a workflow_dispatch run builds
  # and install-tests. packages_from_run skips every build job and runs the
  # install tests on that earlier run's packages, with this run's checkout
  # of the tools/package-install-test* scripts. Use it after changing an
  # install-test script.
  #
  # Push and tag runs have no inputs, and an unset input compares equal to
  # false, so every condition below reads
  # "github.event_name != 'workflow_dispatch' || inputs.<x>": main and tag
  # runs always build and test everything.
  #
  # check-inputs runs on every event (it does nothing on push) so the build,
  # report and docs jobs can need it; on a dispatch it rejects combinations that would run
  # nothing or publish a partial temp release, and checks the source run.
  check-inputs:
    runs-on: ubuntu-24.04
    permissions:
      actions: read
    steps:
      - name: Check dispatch inputs
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ github.token }}
          LINUX: ${{ inputs.linux }}
          WINDOWS: ${{ inputs.windows }}
          MACOS: ${{ inputs.macos }}
          FROM_RUN: ${{ inputs.packages_from_run }}
          TEMP_RELEASE: ${{ inputs.publish_temp_release }}
        run: |
          if [ "$LINUX$WINDOWS$MACOS" = falsefalsefalse ]; then
            echo "::error::no platform selected"
            exit 1
          fi
          if [ "$TEMP_RELEASE" = true ] && { [ -n "$FROM_RUN" ] || [ "$LINUX$WINDOWS$MACOS" != truetruetrue ]; }; then
            echo "::error::publish_temp_release needs freshly built packages for every platform"
            exit 1
          fi
          [ -n "$FROM_RUN" ] || exit 0
          case "$FROM_RUN" in
          *[!0-9]*)
            echo "::error::packages_from_run must be a run ID, got '$FROM_RUN'"
            exit 1
            ;;
          esac
          INFO=$(gh run view "$FROM_RUN" --repo "$GITHUB_REPOSITORY" \
            --json workflowName,headBranch,headSha,conclusion,createdAt \
            --jq '"\(.workflowName)|\(.headBranch) \(.headSha[0:8]), \(.conclusion | if . == "" or . == null then "in progress" else . end), \(.createdAt)"')
          case "$INFO" in
          Release\|*) echo "install-testing packages from run $FROM_RUN: ${INFO#Release|}" ;;
          *)
            echo "::error::run $FROM_RUN is not a Release run (${INFO%%|*})"
            exit 1
            ;;
          esac

  # ── Packages, one reusable workflow per platform ────────────────────────
  # Each needs check-inputs, and is skipped when a dispatch turns its platform
  # off or reuses an earlier run's packages (packages_from_run).
  packages-linux:
    needs: [check-inputs]
    if: ${{ github.event_name != 'workflow_dispatch' || (inputs.linux && inputs.packages_from_run == '') }}
    uses: ./.github/workflows/packages-linux.yml

  packages-macos:
    needs: [check-inputs]
    if: ${{ github.event_name != 'workflow_dispatch' || (inputs.macos && inputs.packages_from_run == '') }}
    uses: ./.github/workflows/packages-macos.yml
    with:
      include_dmg: ${{ github.event_name == 'workflow_dispatch' && inputs.include_dmg }}

  packages-windows:
    needs: [check-inputs]
    if: ${{ github.event_name != 'workflow_dispatch' || (inputs.windows && inputs.packages_from_run == '') }}
    uses: ./.github/workflows/packages-windows.yml
    with:
      include_nsis: ${{ github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.include_nsis) }}

  # ── Install tests, one call per platform ────────────────────────────────
  # Each waits only for its own platform's packages. They don't hold back
  # latest-main, but github-release needs them, so a release is only drafted
  # when every install test passed (Development Issues #48). !cancelled()
  # lets them run when packages-* was skipped for packages_from_run.
  install-tests-linux:
    needs: [check-inputs, packages-linux]
    if: ${{ !cancelled() && needs.check-inputs.result == 'success' && (github.event_name != 'workflow_dispatch' || inputs.linux) }}
    uses: ./.github/workflows/install-tests.yml
    permissions:
      actions: read
      contents: read
    with:
      linux: true
      packages_from_run: ${{ inputs.packages_from_run || '' }}

  install-tests-windows:
    needs: [check-inputs, packages-windows]
    if: ${{ !cancelled() && needs.check-inputs.result == 'success' && (github.event_name != 'workflow_dispatch' || inputs.windows) }}
    uses: ./.github/workflows/install-tests.yml
    permissions:
      actions: read
      contents: read
    with:
      windows: true
      include_nsis: ${{ github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.include_nsis) }}
      packages_from_run: ${{ inputs.packages_from_run || '' }}

  install-tests-macos:
    needs: [check-inputs, packages-macos]
    if: ${{ !cancelled() && needs.check-inputs.result == 'success' && (github.event_name != 'workflow_dispatch' || inputs.macos) }}
    uses: ./.github/workflows/install-tests.yml
    permissions:
      actions: read
      contents: read
    with:
      macos: true
      packages_from_run: ${{ inputs.packages_from_run || '' }}

  # ── Analysis reports for GitHub Pages ─────────────────────────────────────
  # coverage, cppcheck-deep, clang-tidy, codespell and compiler-warnings as
  # xtrkcad-<tool>-html artifacts, from the same job definitions ci-gtk3.yml
  # runs on every PR (gtk3-qa-reports.yml). deploy-pages unpacks them.
  qa-reports:
    needs: [check-inputs]
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.packages_from_run == '' }}
    uses: ./.github/workflows/gtk3-qa-reports.yml
    with:
      html: true

  package-suppress-inventory:
    needs: [check-inputs]
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.packages_from_run == '' }}
    # Inventory of every cppcheck-suppress/NOLINT(NEXTLINE) comment in
    # app/bin (+ app/wlib/gtk3lib, added 2026-09-02 once cppcheck's own
    # scope widened there -- see tools/scan-suppressions.sh's usage
    # comment for why each root is scanned non-recursively), split into
    # boilerplate (generic "confirmed via broad sampling" reasoning from
    # a prior bulk-approval pass) vs. specific (individualized reasoning)
    # vs. unreasoned (no reason found at all, checking inline "-- reason"
    # text, a same-line trailing block comment, and comment lines
    # immediately following the suppress line).
    # A boilerplate suppress is the one most likely to be hiding a fully
    # removable case -- see SF #749's ccornu.c `ep` discovery, found only
    # because that one happened to get individually re-traced. Answers
    # "are we actually done re-auditing, or did we just stop finding
    # things" without re-deriving the count by hand each time.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Scan for suppress comments
        run: tools/scan-suppressions.sh app/bin app/wlib/gtk3lib app/wlib/gtk3lib/unix > suppressions.txt
      - name: Format as HTML
        run: |
          mkdir -p report
          tools/format-findings-report.sh suppressions.txt report/index.html \
            "Suppress inventory" bracketed \
            "${{ github.server_url }}/${{ github.repository }}/blob/${{ github.sha }}/"
      - name: Archive report
        run: tar -czf xtrkcad-suppress-inventory.tar.gz -C report .
      - name: Upload report
        uses: actions/upload-artifact@v7
        with:
          name: xtrkcad-suppress-inventory-html
          path: xtrkcad-suppress-inventory.tar.gz
          retention-days: 14

  # ── Doxygen documentation — built and uploaded on every push ──────────────
  # Gives a browsable "latest docs" artifact without waiting for a version
  # tag or for the Hg bug branches behind any given doc change to clear
  # their SF review window and merge into main -- this job tracks
  # whatever's on the git mirror right now.
  package-docs:
    needs: [check-inputs]
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.packages_from_run == '' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/apt-deps

      - uses: ./.github/actions/setup-doxygen

      - name: Configure
        # XTRKCAD_USERGUIDE_URL overrides the dev guide's default (relative,
        # same-build-tree) User Guide link with the real absolute URL this
        # job's own Pages deployment below puts it at -- computed from this
        # run's own repository context, not a hardcoded site/account, so it's
        # correct for whichever fork's Actions is doing the deploying.
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DXTRKCAD_USE_DOXYGEN=ON -DXTRKCAD_TESTING=OFF \
            -DXTRKCAD_USERGUIDE_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/userguide/"

      - name: Build docs
        run: cmake --build build --target docs-doxygen

      - name: Archive docs
        run: tar -czf xtrkcad-docs.tar.gz -C build/docs/doxygen/html .

      - name: Upload docs
        uses: actions/upload-artifact@v7
        with:
          name: xtrkcad-docs-html
          path: xtrkcad-docs.tar.gz
          retention-days: 14

      - name: Build user guide
        # help-html (app/doc/CMakeLists.txt) is normally part of the default
        # 'all' target, but this job only builds docs-doxygen above, so it
        # still needs building explicitly here (cmake resolves its
        # msgfiles/Doxygen dependencies automatically). Real Doxygen-based
        # build as of the Halibut -> Doxygen conversion (SF feature-requests
        # #219, see .claude/halibut-doxygen-investigation-plan.md) -- no
        # longer a CI-test-only step, no longer needs tools/but-to-doxygen.py
        # (that was one-time bootstrap tooling; its output is now the
        # committed source in app/doc/*.dox).
        run: cmake --build build --target help-html

      - name: Archive user guide
        run: tar -czf xtrkcad-userguide.tar.gz -C build/app/doc/html .

      - name: Upload user guide
        uses: actions/upload-artifact@v7
        with:
          name: xtrkcad-userguide-html
          path: xtrkcad-userguide.tar.gz
          retention-days: 14

  # ── GitHub Pages — Doxygen + user guide, redeployed on every push ─────────
  # Gives stable, permanent URLs that always reflect the latest successful
  # build, unlike the 14-day artifacts above (whose links change every run):
  #   https://<owner>.github.io/<repo>/doxygen/
  #   https://<owner>.github.io/<repo>/userguide/
  # (<owner>/<repo> being whichever fork's Actions is doing the deploying.)
  deploy-pages:
    needs:
      - package-docs
      - qa-reports
      - package-suppress-inventory
    # Only ordinary main pushes redeploy the live public site -- this
    # job previously had no such guard despite this file's own header
    # comment claiming one (found 2026-08-05 while wiring up the new
    # package-* report jobs, needed a way to workflow_dispatch-test them
    # without publishing untested branch content live). Matches
    # publish-latest-release's existing guard below.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
      actions: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Remove stale github-pages artifacts from earlier attempts
        # actions/deploy-pages fetches the run's "github-pages" artifact by
        # name and errors out ("Multiple artifacts named github-pages were
        # unexpectedly found") if more than one exists. That happens
        # whenever this job is re-run after a previous attempt already got
        # as far as "Upload Pages artifact" -- e.g. attempt 1 uploads fine
        # but then times out on GitHub's Pages backend (deployment_queued),
        # and a re-run of just this job uploads a second one. Artifacts
        # aren't cleaned up between attempts of the same run, so clear any
        # pre-existing ones before uploading a fresh copy (found 2026-08-06,
        # run 31105550052).
        run: |
          gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" \
            --paginate --jq '.artifacts[] | select(.name=="github-pages") | .id' |
          while read -r id; do
            echo "Deleting stale github-pages artifact $id"
            gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id"
          done
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Download docs artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: 'xtrkcad-*-html'
          path: downloaded

      - name: Assemble Pages site
        run: |
          mkdir -p site/doxygen site/userguide site/coverage site/cppcheck-deep site/clang-tidy site/codespell site/compiler-warnings site/suppress-inventory
          tar -xzf downloaded/xtrkcad-docs-html/xtrkcad-docs.tar.gz -C site/doxygen
          tar -xzf downloaded/xtrkcad-userguide-html/xtrkcad-userguide.tar.gz -C site/userguide
          tar -xzf downloaded/xtrkcad-coverage-html/xtrkcad-coverage.tar.gz -C site/coverage
          tar -xzf downloaded/xtrkcad-cppcheck-deep-html/xtrkcad-cppcheck-deep.tar.gz -C site/cppcheck-deep
          tar -xzf downloaded/xtrkcad-clang-tidy-html/xtrkcad-clang-tidy.tar.gz -C site/clang-tidy
          tar -xzf downloaded/xtrkcad-codespell-html/xtrkcad-codespell.tar.gz -C site/codespell
          tar -xzf downloaded/xtrkcad-compiler-warnings-html/xtrkcad-compiler-warnings.tar.gz -C site/compiler-warnings
          tar -xzf downloaded/xtrkcad-suppress-inventory-html/xtrkcad-suppress-inventory.tar.gz -C site/suppress-inventory
          # The macOS and Windows reports are continue-on-error jobs, so a
          # runner problem can leave them out; say so instead of failing.
          for os in macos windows; do
            mkdir -p "site/compiler-warnings-$os"
            tgz="downloaded/xtrkcad-compiler-warnings-$os-html/xtrkcad-compiler-warnings-$os.tar.gz"
            if [ -f "$tgz" ]; then
              tar -xzf "$tgz" -C "site/compiler-warnings-$os"
            else
              echo "<!doctype html><title>Not available</title><p>This run produced no $os compiler-warnings report; see the release.yml run's qa-reports jobs.</p>" \
                > "site/compiler-warnings-$os/index.html"
            fi
          done
          cat > site/index.html <<'PAGEEOF'
          <!doctype html>
          <html lang="en">
          <head><meta charset="utf-8"><title>XTrkCAD — Latest Docs</title></head>
          <body>
          <h1>XTrkCAD — Latest Documentation</h1>
          <p>Redeployed automatically on every successful push to main.</p>
          <ul>
            <li><a href="doxygen/">Developer documentation (Doxygen)</a></li>
            <li><a href="userguide/">User guide</a></li>
            <li><a href="${{ github.server_url }}/${{ github.repository }}/releases/tag/latest-main">Latest development build (packages)</a></li>
          </ul>
          <h2>Analysis reports</h2>
          <p>Report-only, non-gating -- findings backlogs, not build failures. Each link back to the
          exact commit's source on GitHub.</p>
          <ul>
            <li><a href="coverage/">Code coverage</a> (unit tests + full regression suite, branch coverage)</li>
            <li><a href="cppcheck-deep/">cppcheck (deep)</a></li>
            <li><a href="clang-tidy/">clang-tidy</a></li>
            <li><a href="codespell/">codespell</a></li>
            <li>Compiler warnings, -Wall -Wextra: <a href="compiler-warnings/">Linux (GCC)</a>,
              <a href="compiler-warnings-macos/">macOS (AppleClang)</a>,
              <a href="compiler-warnings-windows/">Windows (MinGW GCC)</a></li>
            <li><a href="suppress-inventory/">Suppress inventory</a> (cppcheck-suppress/NOLINT comments, boilerplate vs. specific reasoning)</li>
          </ul>
          </body>
          </html>
          PAGEEOF

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # ── "Latest" GitHub Release — rolling, tracks the newest main push ──
  # Unlike the artifacts above, this is one permanent, unchanging URL:
  #   <server>/<owner>/<repo>/releases/tag/latest-main
  # Only runs on ordinary main pushes: version tags get their own
  # permanent release via github-release below, and workflow_dispatch runs
  # (which may opt into experimental NSIS/DMG builds) are excluded so those
  # can't silently replace the normal rolling-release assets.
  publish-latest-release:
    needs: [packages-linux, packages-macos, packages-windows]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    concurrency:
      group: latest-main-release
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download all packages
        uses: actions/download-artifact@v8
        with:
          path: release-packages
          merge-multiple: true

      - name: Remove GitHub Pages deployment bundle
        # actions/upload-pages-artifact (used by deploy-pages) also uploads a
        # regular workflow artifact named "github-pages" whose file is always
        # called artifact.tar — an opaque tarball of the whole Pages site,
        # not a real package. With no name filter above, download-artifact
        # pulls it in alongside the real packages; strip it out explicitly
        # rather than relying on glob-pattern filtering syntax.
        run: rm -f release-packages/artifact.tar

      - name: List packages
        run: find release-packages -type f | sort

      - name: Update rolling 'latest-main' release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t FILES < <(find release-packages -type f | sort)
          gh release delete latest-main --yes --cleanup-tag || true
          gh release create latest-main \
            --title "Latest Development Build" \
            --target "${{ github.sha }}" \
            --notes "$(printf '%s\n' \
              '**Automatically updated on every successful push to main.**' \
              '' \
              'This is an unstable development build, not a tagged release — for' \
              "production use, see the [tagged releases](${{ github.server_url }}/${{ github.repository }}/releases)." \
              '' \
              "Built from commit ${{ github.sha }}." \
              '' \
              "[Doxygen developer docs](https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/doxygen/) · [User guide](https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/userguide/)")" \
            --prerelease \
            --latest=false \
            "${FILES[@]}"

  # ── Temporary review-branch release — opt-in via workflow_dispatch ────────
  # For review branches not going into main yet (e.g. a large,
  # one-way removal like the Halibut -> Doxygen migration) but where
  # reviewers want real installable packages, not just a source checkout.
  # Explicit opt-in only (publish_temp_release input, default false) so an
  # ordinary CI-proving workflow_dispatch run never publishes anything.
  # Tag is branch-derived and deleted+recreated on every dispatch (same
  # rolling pattern as publish-latest-release above), so re-running updates
  # it in place instead of accumulating releases. This is NOT a substitute
  # for the real latest-main rolling release or a tagged release --
  # delete the tag once the branch merges or is abandoned (github-release
  # and publish-latest-release are both unaffected by this job).
  publish-temp-release:
    needs: [packages-linux, packages-macos, packages-windows]
    if: github.event_name == 'workflow_dispatch' && inputs.publish_temp_release == true
    runs-on: ubuntu-24.04
    concurrency:
      group: temp-release-${{ github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download all packages
        uses: actions/download-artifact@v8
        with:
          path: release-packages
          merge-multiple: true

      - name: Remove GitHub Pages deployment bundle
        # See publish-latest-release's identical step above for why.
        run: rm -f release-packages/artifact.tar

      - name: List packages
        run: find release-packages -type f | sort

      - name: Compute temp release tag
        run: |
          # GitHub tag/release names are more permissive than this needs to
          # be strict about -- branch names here are already tag-safe, but
          # sanitize defensively (slashes are the one real risk, e.g. a
          # future user/foo-branch).
          SAFE_REF="$(echo '${{ github.ref_name }}' | tr '/' '-')"
          echo "TEMP_TAG=temp-${SAFE_REF}" >> "$GITHUB_ENV"

      - name: Update the temporary release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t FILES < <(find release-packages -type f | sort)
          gh release delete "$TEMP_TAG" --yes --cleanup-tag || true
          gh release create "$TEMP_TAG" \
            --title "TEMP — ${{ github.ref_name }} (review build, not for production)" \
            --target "${{ github.sha }}" \
            --notes "$(printf '%s\n' \
              '**Temporary review build — not a real release.**' \
              '' \
              "Branch \`${{ github.ref_name }}\`, commit ${{ github.sha }}." \
              'This tag is deleted and recreated on every dispatch of this workflow' \
              'for this branch, and should itself be deleted once the branch merges' \
              'or is abandoned. Not linked from anywhere permanent.')" \
            --prerelease \
            --latest=false \
            "${FILES[@]}"

  # ── Release tag check — only on version tags ──────────────────────────────
  # The tag must name the version ProgramVersion.cmake builds: v<version>
  # for a release, or v<version>-<suffix> (e.g. v5.4.0-test1) for a trial
  # run, which github-release publishes as a prerelease. Without this, a
  # tag v5.4.1 on a commit still at 5.4.0 drafted "XTrkCAD v5.4.1" with
  # 5.4.0 packages (Development Issues #48).
  check-release-tag:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Tag matches ProgramVersion.cmake
        run: |
          MAJOR=$(awk -F'"' '/set\(XTRKCAD_MAJOR_VERSION/{print $2; exit}' ProgramVersion.cmake)
          MINOR=$(awk -F'"' '/set\(XTRKCAD_MINOR_VERSION/{print $2; exit}' ProgramVersion.cmake)
          PATCH=$(awk -F'"' '/set\(XTRKCAD_RELEASE_VERSION/{print $2; exit}' ProgramVersion.cmake)
          MODIFIER=$(awk -F'"' '/set\(XTRKCAD_VERSION_MODIFIER/{print $2; exit}' ProgramVersion.cmake)
          VERSION="${MAJOR}.${MINOR}.${PATCH}${MODIFIER}"
          TAG="${{ github.ref_name }}"
          case "$TAG" in
          "v$VERSION") echo "release tag $TAG" ;;
          "v$VERSION"-*) echo "trial tag $TAG, will publish as a prerelease" ;;
          *)
            echo "::error::tag $TAG does not match ProgramVersion.cmake ($VERSION): use v$VERSION, or v$VERSION-<suffix> for a trial"
            exit 1
            ;;
          esac

  # ── GitHub Release — created only on version tags ──────────────────────────
  # Waits for the install tests as well as the packages: a release is only
  # drafted from packages that installed and ran on clean systems.
  github-release:
    needs: [check-release-tag, packages-linux, packages-macos, packages-windows, package-docs, install-tests-linux, install-tests-windows, install-tests-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download all packages
        uses: actions/download-artifact@v8
        with:
          path: release-packages
          merge-multiple: true

      - name: Remove GitHub Pages deployment bundle
        # See the same step in publish-latest-release above — the
        # deploy-pages job's artifact isn't a real package.
        run: rm -f release-packages/artifact.tar

      - name: List packages
        run: find release-packages -type f | sort

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          # A suffixed tag (v5.4.0-test1) is a trial run, checked by
          # check-release-tag: mark it a prerelease.
          PRERELEASE=()
          case "$TAG" in *-*) PRERELEASE=(--prerelease --latest=false) ;; esac
          # Flatten all artifact subdirectories into a single file list
          mapfile -t FILES < <(find release-packages -type f | sort)
          gh release create "$TAG" \
            --title "XTrkCAD ${TAG}" \
            --generate-notes \
            --draft \
            "${PRERELEASE[@]}" \
            "${FILES[@]}"
