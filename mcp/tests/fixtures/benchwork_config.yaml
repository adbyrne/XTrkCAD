name: Benchwork Test Layout
scale: HO
room: 17.833x24.667   # 214x296 inches

levels: 2
level_separation: 18in

benchwork:
  default_depth: 24

  walls:
    - label: west
      side: west
      from: 0
      to: 296
      depth: 24

    - label: south
      side: south
      from: 0
      to: 214
      depth: 24

    - label: north_ul
      side: north
      from: 0
      to: 125
      # no depth — should inherit default_depth: 24

    - label: north_ur
      side: north
      from: 131
      to: 209
      depth: 24
      levels: [2]       # upper level only

  obstructions:
    - label: hall_rect
      type: rect
      x: 163
      y: 176
      width: 50
      height: 36

    - label: triangle
      type: triangle
      vertices:
        - [163, 176]
        - [214, 176]
        - [214, 100]

grid: []
