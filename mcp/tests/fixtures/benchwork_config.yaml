name: Benchwork Test Layout
scale: HO
room: 17.833x24.667   # 214x296 inches

levels: 2
level_separation: 18in

benchwork:
  default_depth: 26   # lower-level typical; upper level is 12in (per-level depth TBD)

  walls:
    - label: west
      side: west
      from: 0
      to: 296
      # no depth — inherits default_depth: 26

    - label: south
      side: south
      from: 0
      to: 214
      # no depth — inherits default_depth: 26

    - label: north_ul
      side: north
      from: 0
      to: 125
      # no depth — inherits default_depth: 26

    - label: wall_x131
      side: interior
      x: 131            # interior wall separating main room from UR section
      y: 0
      width: 32         # 32 inches east (X=131 to X=163)
      height: 296       # full room height
      levels: [2]       # upper level only

  obstructions:
    - label: interior_wall_marker
      type: rect
      x: 131               # physical interior wall at X=131 (3in symbolic thickness)
      y: 0
      width: 3
      height: 296

    - label: east_triangle  # east access corner — exercises triangle parsing
      type: triangle
      vertices:
        - [163, 176]
        - [214, 176]
        - [214, 100]

grid: []
