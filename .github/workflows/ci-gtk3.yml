name: CI (GTK3V2MAIN)
on:
  push:
    branches:
      - GTK3V2MAIN

jobs:
  doxygen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y cmake libgtk-3-dev doxygen graphviz libzip-dev zlib1g-dev
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug -DXTRKCAD_USE_DOXYGEN=ON -DXTRKCAD_TESTING=OFF
      - name: Build docs
        run: cmake --build build --target docs-doxygen

  c-tests-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y cmake libgtk-3-dev libcmocka-dev zlib1g-dev libzip-dev libmxml-dev librsvg2-bin gettext
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug -DXTRKCAD_TESTING=ON
      - name: Build
        run: cmake --build build --parallel $(nproc)
      - name: Test
        run: ctest --test-dir build --output-on-failure

  c-tests-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        run: brew install gtk+3 cmocka libzip librsvg
      - name: Configure
        run: |
          GTK_PREFIX=$(brew --prefix gtk+3)
          export PKG_CONFIG_PATH="$GTK_PREFIX/lib/pkgconfig:$(brew --prefix)/lib/pkgconfig"
          GTK_LDFLAGS=$(pkg-config --libs-only-L gtk+-3.0)
          cmake -B build -DCMAKE_BUILD_TYPE=Debug -DXTRKCAD_TESTING=ON \
            -DCMAKE_PREFIX_PATH="$GTK_PREFIX;$(brew --prefix)" \
            -DCMAKE_EXE_LINKER_FLAGS="$GTK_LDFLAGS" \
            -DXTRKCAD_USE_APPLEHELP=OFF -DXTRKCAD_USE_BROWSER=ON
      - name: Build
        run: cmake --build build --parallel $(sysctl -n hw.ncpu)
      - name: Test
        run: ctest --test-dir build --output-on-failure

  c-tests-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install rsvg-convert
        # rsvg-convert converts SVG toolbar icons to PNG during the build.
        # MSYS2 is pre-installed on Windows runners; mingw-w64-x86_64-librsvg
        # provides rsvg-convert.exe in C:\msys64\mingw64\bin.
        run: |
          C:\msys64\usr\bin\pacman.exe -Sq --noconfirm mingw-w64-x86_64-librsvg
          echo "C:\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Cache vcpkg packages
        uses: actions/cache@v4
        id: vcpkg-cache
        with:
          path: C:\vcpkg\installed
          key: vcpkg-x64-windows-cmocka-zlib-libzip-freeimage-v1
      - name: Install dependencies
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        run: vcpkg install cmocka:x64-windows zlib:x64-windows libzip:x64-windows freeimage:x64-windows
      - name: Add vcpkg bin to PATH
        # pngtoxpm.exe loads FreeImage.dll (copied beside it at build time), but
        # FreeImage.dll's transitive vcpkg deps (libpng, libjpeg-turbo, zlib1, webp…)
        # are only in the vcpkg bin dir — not on PATH by default.  Add both release
        # and debug bin dirs so custom build commands and ctest can find all DLLs.
        run: |
          echo "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\debug\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug -DXTRKCAD_TESTING=ON -DXTRKCAD_USE_GETTEXT=OFF "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" "-DCMAKE_PREFIX_PATH=$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows"
      - name: Build
        run: |
          cmake --build build --config Debug 2>&1 | Tee-Object -FilePath build/build-log.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-log
          path: build/build-log.txt
      - name: Test
        run: ctest --test-dir build -C Debug --output-on-failure
