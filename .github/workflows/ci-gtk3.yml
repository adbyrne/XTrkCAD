name: CI (GTK3V2MAIN)
on:
  push:
    branches:
      - GTK3V2MAIN
      - test/upstream-gtk3*
      - test/windows-gtk3*
  pull_request:
    branches:
      - GTK3V2MAIN

jobs:
  doxygen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y cmake libgtk-3-dev doxygen graphviz libzip-dev zlib1g-dev
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug -DXTRKCAD_USE_DOXYGEN=ON -DXTRKCAD_TESTING=OFF
      - name: Build docs
        run: cmake --build build --target docs-doxygen

  c-tests-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y cmake libgtk-3-dev libcmocka-dev zlib1g-dev libzip-dev libmxml-dev librsvg2-bin gettext xvfb
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug -DXTRKCAD_TESTING=ON
      - name: Build
        run: cmake --build build --parallel $(nproc)
      - name: Test
        run: xvfb-run ctest --test-dir build --output-on-failure

  c-tests-arm64:
    # Native ARM64 runner — same architecture as Raspberry Pi 3/4/5
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y cmake libgtk-3-dev libcmocka-dev zlib1g-dev libzip-dev libmxml-dev librsvg2-bin gettext xvfb
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug -DXTRKCAD_TESTING=ON
      - name: Build
        run: cmake --build build --parallel $(nproc)
      - name: Test
        run: xvfb-run ctest --test-dir build --output-on-failure

  c-tests-linux-clang:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y cmake clang libgtk-3-dev libcmocka-dev zlib1g-dev libzip-dev libmxml-dev librsvg2-bin gettext xvfb
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug -DXTRKCAD_TESTING=ON -DCMAKE_C_COMPILER=clang
      - name: Build
        run: cmake --build build --parallel $(nproc)
      - name: Test
        run: xvfb-run ctest --test-dir build --output-on-failure

  c-tests-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        run: brew install gtk+3 cmocka libzip librsvg
      - name: Configure
        run: |
          GTK_PREFIX=$(brew --prefix gtk+3)
          export PKG_CONFIG_PATH="$GTK_PREFIX/lib/pkgconfig:$(brew --prefix)/lib/pkgconfig"
          GTK_LDFLAGS=$(pkg-config --libs-only-L gtk+-3.0)
          cmake -B build -DCMAKE_BUILD_TYPE=Debug -DXTRKCAD_TESTING=ON \
            -DCMAKE_PREFIX_PATH="$GTK_PREFIX;$(brew --prefix)" \
            -DCMAKE_EXE_LINKER_FLAGS="$GTK_LDFLAGS" \
            -DXTRKCAD_USE_APPLEHELP=OFF -DXTRKCAD_USE_BROWSER=ON
      - name: Build
        run: cmake --build build --parallel $(sysctl -n hw.ncpu)
      - name: Test
        run: ctest --test-dir build --output-on-failure

  c-tests-windows-msys2:
    # GTK3 on Windows via MSYS2/MinGW64 — replaces the old mswlib/MSVC job.
    # mswlib was removed from GTK3V2MAIN in SF r6508; Windows now builds
    # against GTK3 directly using the official GTK Windows runtime (MSYS2).
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v5
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pkg-config
            mingw-w64-x86_64-gtk3
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-libzip
            mingw-w64-x86_64-mxml
            mingw-w64-x86_64-librsvg
            mingw-w64-x86_64-gettext
            mingw-w64-x86_64-cmocka
      - name: Configure
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DXTRKCAD_TESTING=ON \
            -DXTRKCAD_USE_GETTEXT=OFF
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
