name: CI (MCP)
on:
  push:
    branches:
      - GTK3V2MAIN
      - test/**
    paths:
      - 'mcp/**'
      - '.github/workflows/ci-mcp.yml'
  pull_request:
    branches:
      - GTK3V2MAIN
    paths:
      - 'mcp/**'
      - '.github/workflows/ci-mcp.yml'

# MCP (mcp/) is GTK3V2MAIN-only by design (dropped from the GTK2 main branch
# in 14d0c9eb) -- this job used to live in ci.yml, but that workflow's own
# trigger only watches `main`, where mcp/ doesn't exist, so it never actually
# ran. Split into its own file rather than folded into ci-gtk3.yml so MCP
# keeps an independent CI status separate from the (much larger) C app suite.

jobs:
  mcp-tests:
    strategy:
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04, macos-26, windows-2025]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          # Pin the interpreter: uv otherwise picks the newest Python that
          # satisfies requires-python, and macos-latest moved to 3.15, which
          # rpds-py (via PyO3, max 3.14) can't build for (2026-10-18).
          python-version: "3.14"
      - name: Run MCP tests
        working-directory: mcp
        run: uv run --extra dev pytest -q
