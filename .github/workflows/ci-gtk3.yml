name: CI (GTK3V2MAIN)
on:
  push:
    branches:
      - GTK3V2MAIN
      - test/**
  pull_request:
    branches:
      - GTK3V2MAIN

jobs:
  doxygen:
    # Doxygen is pinned to DOXYGEN_VERSION (official prebuilt Linux binary,
    # not the apt package) rather than left to whatever Ubuntu's repo
    # resolves to -- avoids the kind of silent tool drift astyle hit in SF
    # #638. Bumped 2026-07-17 from 1.9.8 to 1.15.0 (matches what Ubuntu
    # 26.04 ships) after confirming identical warning output on the current
    # tree between both versions.
    #
    # docs/doxygen/Doxyfile.in was ported from Hg on 2026-07-16 to close a
    # git/Hg divergence (git's copy predated an upstream 2026-05-07 tightening
    # -- SF rev 6446/6432 -- and had separately drifted onto a different
    # Doxygen-version template). WARN_AS_ERROR is deliberately kept at NO
    # here even though Hg now sets FAIL_ON_WARNINGS: flipping it needs the
    # remaining pre-existing @param/return-type doc gaps triaged or
    # suppressed first (see .claude/doxygen-triage-plan.md; down to 402 as
    # of 2026-07-17, from an original 930).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DOXYGEN_VERSION: 1.15.0
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y cmake ninja-build libgtk-3-dev graphviz libzip-dev zlib1g-dev
      - name: Install pinned Doxygen ${{ env.DOXYGEN_VERSION }}
        run: |
          curl -sL -o doxygen.tar.gz "https://github.com/doxygen/doxygen/releases/download/Release_${DOXYGEN_VERSION//./_}/doxygen-${DOXYGEN_VERSION}.linux.bin.tar.gz"
          tar xzf doxygen.tar.gz
          echo "$PWD/doxygen-${DOXYGEN_VERSION}/bin" >> "$GITHUB_PATH"
      - name: Configure
        run: |
          doxygen --version
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DXTRKCAD_USE_DOXYGEN=ON -DXTRKCAD_TESTING=OFF
      - name: Build docs
        run: cmake --build build --target docs-doxygen

  help-links-check:
    # Gating. Verifies every command-context help (F1) link actually resolves.
    # app/wlib/gtk3lib/help.c's DoHelpMenu() (SHOWHELPFORCOMMAND case) opens
    # file:///<AppLibDir>/html/<GetCurCommandName()>.html with no fallback --
    # if the page is missing the user just gets a generic file-not-found
    # notice. GetCurCommandName() only ever returns a helpKey that was
    # registered via AddMenuButton() (traced through menu.c's AddMenuButton
    # -> AddCommand wrapper chain -- AddToolbarButton's helpStr, by contrast,
    # is tooltip text only and isn't reachable from GetCurCommandName()).
    #
    # This is a *different* Doxygen run than the doxygen job above: that one
    # builds the internal API docs (docs/doxygen/Doxyfile.in, gated by
    # XTRKCAD_USE_DOXYGEN); this job builds the User Guide the app actually
    # ships and wHelp() points at (app/doc/Doxyfile.in, the help-html
    # target -- builds automatically whenever Doxygen is found, no flag
    # needed). Confirmed empirically 2026-08-25 that the two targets' INPUT
    # sets don't overlap at all -- app/doc/*.dox (where every \page cmd...
    # topic lives) isn't in the internal-docs job's INPUT.
    #
    # Found via SF #729 (cmdTurnoutHotBar.html + 3 more missing after the
    # SF #219 Halibut->Doxygen migration, same regression class as #728's
    # Contents-link fix) -- confirmed with a real local Doxygen 1.16.1 build
    # of help-html, not guessed from page IDs (Doxygen's page-id-to-filename
    # mapping isn't always literal -- CASE_SENSE_NAMES/SHORT_NAMES can change
    # it, so this reads the real generated app/doc/html/*.html file list).
    #
    # GTK3V2MAIN only: default/GTK2 still uses Halibut, which resolves help
    # topics differently -- same scoping as SF #728.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DOXYGEN_VERSION: 1.15.0
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y cmake ninja-build libgtk-3-dev graphviz libzip-dev zlib1g-dev
      - name: Install pinned Doxygen ${{ env.DOXYGEN_VERSION }}
        run: |
          curl -sL -o doxygen.tar.gz "https://github.com/doxygen/doxygen/releases/download/Release_${DOXYGEN_VERSION//./_}/doxygen-${DOXYGEN_VERSION}.linux.bin.tar.gz"
          tar xzf doxygen.tar.gz
          echo "$PWD/doxygen-${DOXYGEN_VERSION}/bin" >> "$GITHUB_PATH"
      - name: Configure
        run: |
          doxygen --version
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DXTRKCAD_TESTING=OFF
      - name: Build User Guide (help-html)
        run: cmake --build build --target help-html
      - name: Verify every command-context help key has a matching page
        run: |
          # Known gap, tracked at SF #729 (filed 2026-08-25, same session this
          # job was added): 4 pre-existing broken links found when this check
          # was built, deliberately not fixed here since the actual fix
          # (author real content for cmdTurnoutHotBar vs. rename the 3
          # *Create keys to reuse their near-match existing page) is a doc
          # content call, not a mechanical one. Remove entries from this list
          # as #729 lands so the gate goes back to catching 100% of drift.
          KNOWN_MISSING="cmdTurnoutHotBar cmdBlockCreate cmdCornuCreate cmdSwitchMotorCreate"

          MISSING=""
          while IFS= read -r key; do
            [ -f "build/app/doc/html/${key}.html" ] || MISSING="$MISSING $key"
          done < <(grep -rhoE 'AddMenuButton\([^,]+,[^,]+,\s*"[A-Za-z0-9_]+"' app/bin/*.c \
                    | grep -oE '"[A-Za-z0-9_]+"$' | tr -d '"' | sort -u)
          [ -f "build/app/doc/html/index.html" ] || MISSING="$MISSING index"

          NEW_MISSING=""
          for key in $MISSING; do
            case " $KNOWN_MISSING " in
              *" $key "*) ;;
              *) NEW_MISSING="$NEW_MISSING $key" ;;
            esac
          done

          if [ -n "$NEW_MISSING" ]; then
            echo "::error::Command-context help (F1, DoHelpMenu's SHOWHELPFORCOMMAND) references pages missing from the built User Guide, beyond the already-tracked SF #729 set:$NEW_MISSING"
            echo "Each AddMenuButton() helpKey above needs a matching '\\page <key>' in app/doc/*.dox, or the code's helpKey needs fixing to match an existing page."
            exit 1
          fi
          echo "No new broken command-context help links (known SF #729 gap:$KNOWN_MISSING)."

  c-tests-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y cmake ninja-build libgtk-3-dev libcmocka-dev zlib1g-dev libzip-dev libmxml-dev librsvg2-bin gettext xvfb
      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DXTRKCAD_TESTING=ON
      - name: Build
        run: cmake --build build
      - name: Test
        # GTK3 issue #26's demo-playback regression suite has its own job
        # (regression-gtk3) -- exclude it here so it doesn't get picked up by
        # XTRKCAD_REGRESSION_TESTING's auto-detect default and slow this job down.
        run: xvfb-run ctest --test-dir build --output-on-failure -LE regression

  regression-gtk3:
    # GTK3 issue #26's demo-playback regression suite (RegressionTestAll(), the
    # -T flag). Split into its own job rather than folded into c-tests-linux so
    # the fast unit-test feedback loop there isn't held up by this job's ~9
    # minute single-process playback baseline. Gates on the RegressionSuite
    # ctest target only (label regression-ci) -- not the ~47 individual
    # per-demo tests also registered by XTRKCAD_REGRESSION_TESTING, which exist
    # for local dev targeting (`ctest -R Regression.dmease.xtr`) and would
    # multiply per-test process/X-session startup overhead in CI.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y cmake ninja-build libgtk-3-dev libcmocka-dev zlib1g-dev libzip-dev libmxml-dev librsvg2-bin gettext xvfb
      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DXTRKCAD_TESTING=ON -DXTRKCAD_REGRESSION_TESTING=ON
      - name: Build
        run: cmake --build build
      - name: Regression suite
        run: ctest --test-dir build -L regression-ci --output-on-failure -VV

  regression-gtk3-standalone:
    # Companion to regression-gtk3 above: runs the ~47 individual per-demo
    # tests (label "regression", excluding "regression-ci") that job
    # deliberately skips. These exercise each demo standalone in its own
    # fresh process, which is a meaningfully different code path from
    # RegressionSuite's single warm process -- several real bugs (GTK3
    # issues #21, #24) only ever manifested cold/standalone and passed
    # RegressionSuite fine, so this job exists to actually catch that class
    # going forward rather than relying on someone happening to run these
    # locally. Self-contained (own checkout/build) matching every other job
    # in this file, even though it duplicates the build regression-gtk3
    # already does -- keeps each job simple and independently rerunnable,
    # at the cost of some redundant build time.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y cmake ninja-build libgtk-3-dev libcmocka-dev zlib1g-dev libzip-dev libmxml-dev librsvg2-bin gettext xvfb
      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DXTRKCAD_TESTING=ON -DXTRKCAD_REGRESSION_TESTING=ON
      - name: Build
        run: cmake --build build
      - name: Standalone per-demo regression tests
        run: ctest --test-dir build -L "^regression$" -LE "regression-ci" --output-on-failure -VV

  c-tests-arm64:
    # Native ARM64 runner — same architecture as Raspberry Pi 3/4/5
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y cmake ninja-build libgtk-3-dev libcmocka-dev zlib1g-dev libzip-dev libmxml-dev librsvg2-bin gettext xvfb
      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DXTRKCAD_TESTING=ON
      - name: Build
        run: cmake --build build
      - name: Test
        # See c-tests-linux: regression-gtk3 covers the GTK3 issue #26 suite.
        run: xvfb-run ctest --test-dir build --output-on-failure -LE regression

  c-tests-linux-clang:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y cmake ninja-build clang libgtk-3-dev libcmocka-dev zlib1g-dev libzip-dev libmxml-dev librsvg2-bin gettext xvfb
      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DXTRKCAD_TESTING=ON -DCMAKE_C_COMPILER=clang
      - name: Build
        run: cmake --build build
      - name: Test
        # See c-tests-linux: regression-gtk3 covers the GTK3 issue #26 suite.
        run: xvfb-run ctest --test-dir build --output-on-failure -LE regression

  c-tests-macos:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: brew install ninja gtk+3 cmocka libzip librsvg
      - name: Configure
        run: |
          GTK_PREFIX=$(brew --prefix gtk+3)
          PKG_CONFIG_PATH="$GTK_PREFIX/lib/pkgconfig:$(brew --prefix)/lib/pkgconfig"
          export PKG_CONFIG_PATH
          GTK_LDFLAGS=$(pkg-config --libs-only-L gtk+-3.0)
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DXTRKCAD_TESTING=ON \
            -DCMAKE_PREFIX_PATH="$GTK_PREFIX;$(brew --prefix)" \
            -DCMAKE_EXE_LINKER_FLAGS="$GTK_LDFLAGS" \
            -DXTRKCAD_USE_APPLEHELP=OFF -DXTRKCAD_USE_BROWSER=ON
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  c-tests-windows-msys2:
    # GTK3 on Windows via MSYS2/MinGW64 — replaces the old mswlib/MSVC job.
    # mswlib was removed from GTK3V2MAIN in SF r6508; Windows now builds
    # against GTK3 directly using the official GTK Windows runtime (MSYS2).
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pkg-config
            mingw-w64-x86_64-gtk3
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-libzip
            mingw-w64-x86_64-mxml
            mingw-w64-x86_64-librsvg
            mingw-w64-x86_64-gettext
            mingw-w64-x86_64-cmocka
      - name: Configure
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DXTRKCAD_TESTING=ON \
            -DXTRKCAD_USE_GETTEXT=OFF
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure

  c-tests-sanitizers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y cmake ninja-build clang libgtk-3-dev libcmocka-dev zlib1g-dev libzip-dev libmxml-dev librsvg2-bin gettext xvfb
      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DXTRKCAD_TESTING=ON -DXTRKCAD_SANITIZE=ON -DCMAKE_C_COMPILER=clang
      - name: Build
        run: cmake --build build
      - name: Test
        env:
          ASAN_OPTIONS: "abort_on_error=1:detect_leaks=1"
          UBSAN_OPTIONS: "abort_on_error=1:print_stacktrace=1"
        # PreferenceTest requires a GTK3 display and triggers GTK3 internal
        # allocations that ASAN flags as leaks. It is covered by c-tests-linux.
        # -LE regression: keeps this job's fast unit-test feedback loop from
        # being held up by the ~3 minute sanitizer-instrumented playback run --
        # see regression-gtk3-sanitizers below, which covers it separately.
        run: ctest --test-dir build --output-on-failure -E PreferenceTest -LE regression

  regression-gtk3-sanitizers:
    # Closes the gap SF #682 documented: c-tests-sanitizers above excludes the
    # demo-playback regression suite (-LE regression), and regression-gtk3
    # below isn't sanitizer-instrumented, so the two were never combined in
    # CI -- only by a human happening to run them together locally, which is
    # exactly how SF #675, #677-#680 were found (see docs/doxygen/advanced.md's
    # "Static tools and a live sanitizer run catch different classes of bug").
    # Scoped to RegressionSuite only (label regression-ci), not the ~47
    # per-demo standalone tests regression-gtk3-standalone runs -- that's the
    # combination that actually found those bugs, and doubling to standalone
    # would multiply per-demo cold-start overhead under ASan instrumentation
    # for unproven additional benefit; can be revisited if that job's own
    # cold-start code path ever needs sanitizer coverage too.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y cmake ninja-build clang libgtk-3-dev libcmocka-dev zlib1g-dev libzip-dev libmxml-dev librsvg2-bin gettext xvfb
      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DXTRKCAD_TESTING=ON -DXTRKCAD_REGRESSION_TESTING=ON -DXTRKCAD_SANITIZE=ON -DCMAKE_C_COMPILER=clang
      - name: Build
        run: cmake --build build
      - name: Regression suite
        env:
          ASAN_OPTIONS: "abort_on_error=1:detect_leaks=1"
          UBSAN_OPTIONS: "abort_on_error=1:print_stacktrace=1"
        run: ctest --test-dir build -L regression-ci --output-on-failure -VV

  c-tests-valgrind:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y cmake ninja-build libgtk-3-dev libcmocka-dev zlib1g-dev libzip-dev libmxml-dev librsvg2-bin gettext xvfb valgrind
      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DXTRKCAD_TESTING=ON
      - name: Build
        run: cmake --build build
      - name: Test under Valgrind
        # PreferenceTest requires a GTK3 display; GTK3 internals also trigger
        # many Valgrind false-positives. It is covered by c-tests-linux.
        # -LE regression: see c-tests-linux; the GTK3 issue #26 suite has its
        # own job (regression-gtk3), not Valgrind-instrumented.
        run: |
          ctest --test-dir build --output-on-failure \
            -E PreferenceTest \
            -LE regression \
            -T memcheck \
            --overwrite "MemoryCheckCommand=$(which valgrind)" \
            --overwrite "MemoryCheckCommandOptions=--error-exitcode=1 --track-origins=yes --leak-check=full"

  cppcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install cppcheck
        run: sudo apt-get update -q && sudo apt-get install -y cppcheck
      - name: Run cppcheck
        run: |
          cppcheck \
            --error-exitcode=1 \
            -j 4 \
            --suppress=missingInclude \
            --suppress=missingIncludeSystem \
            --suppress=nullPointerOutOfMemory \
            --suppress=nullPointerOutOfResources \
            --suppress=nullPointerArithmeticOutOfMemory \
            --suppress=syntaxError:app/bin/archive.c \
            --suppress=syntaxError:app/bin/cturntbl.c \
            --suppress=syntaxError:app/bin/directory.c \
            --suppress=syntaxError:app/bin/paths.c \
            --suppress=syntaxError:app/bin/utility.c \
            --suppress=unknownMacro:app/bin/custom.c \
            --suppress=ctunullpointer:app/bin/track.c \
            --suppress=uninitvar:app/bin/levenshtein.c \
            --suppress=uninitvar:app/bin/problemrep.c \
            --suppress=uninitvar:app/bin/paths.c \
            --suppress=nullPointer:app/bin/partcatalog.c \
            --suppress=missingReturn:app/bin/cturnout.c \
            --suppress=ctuPointerArith:app/bin/cturnout.c \
            -I app/bin -I app/bin/include -I app/wlib/include \
            app/bin/*.c app/dynstring/*.c

  cppcheck-deep:
    # Report-only: the gating `cppcheck` job above only runs cppcheck's default
    # (error-only) severity class. This runs the warning/style/performance/
    # portability classes too -- most of what cppcheck actually checks -- but
    # does NOT fail the build: ~1150 findings surfaced the first time this was
    # run (2026-07-11), almost entirely pre-existing and untriaged. Findings
    # here are a triage backlog, not yet a quality gate.
    #
    # selfAssignment is suppressed for cdraw.c/drawgeom.c specifically: both
    # files use REORIGIN()/UNREORIGIN() macros as in-place coordinate
    # transforms, always called as REORIGIN(x, x, ...) (dest == src by
    # design). cppcheck's selfAssignment check can't see through the macro
    # and flags every call as a no-op assignment; verified 2026-07-11 that
    # all 29 instances across both files are this same pattern, not bugs.
    #
    # Vendored-code exclusion list (quality-plan-gtk3v2main-part2.md Phase 8):
    # this job's file list (app/bin/*.c app/dynstring/*.c) is a non-recursive
    # shell glob, so it never reaches app/wlib/gtk3lib/wrapbox/ or
    # app/tools/halibut/ — out of scope by construction, no exclude needed.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install cppcheck
        run: sudo apt-get update -q && sudo apt-get install -y cppcheck
      - name: Run cppcheck (deep, non-fatal)
        run: |
          cppcheck \
            --enable=warning,style,performance,portability \
            --inline-suppr \
            -j 4 \
            --suppress=missingInclude \
            --suppress=missingIncludeSystem \
            --suppress=nullPointerOutOfMemory \
            --suppress=nullPointerOutOfResources \
            --suppress=nullPointerArithmeticOutOfMemory \
            --suppress=syntaxError:app/bin/archive.c \
            --suppress=syntaxError:app/bin/cturntbl.c \
            --suppress=syntaxError:app/bin/directory.c \
            --suppress=syntaxError:app/bin/paths.c \
            --suppress=syntaxError:app/bin/utility.c \
            --suppress=unknownMacro:app/bin/custom.c \
            --suppress=ctunullpointer:app/bin/track.c \
            --suppress=uninitvar:app/bin/levenshtein.c \
            --suppress=uninitvar:app/bin/problemrep.c \
            --suppress=uninitvar:app/bin/paths.c \
            --suppress=nullPointer:app/bin/partcatalog.c \
            --suppress=missingReturn:app/bin/cturnout.c \
            --suppress=ctuPointerArith:app/bin/cturnout.c \
            --suppress=selfAssignment:app/bin/cdraw.c \
            --suppress=selfAssignment:app/bin/drawgeom.c \
            -I app/bin -I app/bin/include -I app/wlib/include \
            app/bin/*.c app/dynstring/*.c > cppcheck-deep.txt 2>&1 || true
      - name: Summarise findings
        run: |
          COUNT=$(grep -cE '\[[a-zA-Z]+\]$' cppcheck-deep.txt || echo 0)
          echo "Total findings: $COUNT"
          echo ""
          echo "=== By check ==="
          grep -oE '\[[a-zA-Z]+\]$' cppcheck-deep.txt | sort | uniq -c | sort -rn || true
      - name: Upload findings
        uses: actions/upload-artifact@v7
        with:
          name: cppcheck-deep-gtk3
          path: cppcheck-deep.txt

  clang-tidy:
    # Report-only: conservative check-set (bugprone-*/performance-*/portability-*)
    # scoped to app/bin+app/dynstring+app/cornu. Excludes bdf2xtp.c and
    # ppedit_gtk1.c (dead code, not referenced by any CMakeLists.txt target)
    # and helphelper.c (macOS-only, if(APPLE) in app/bin/CMakeLists.txt) --
    # none of the three are part of the Linux build's compile_commands.json,
    # so clang-tidy can't get real compile flags for them and errors out.
    # readability-*/modernize-* deliberately excluded for now -- expected to
    # be high-volume style-only noise on this legacy C codebase.
    #
    # Vendored-code exclusion list (quality-plan-gtk3v2main-part2.md Phase 8):
    # the `find app/bin app/dynstring app/cornu` root list never reaches
    # app/wlib/gtk3lib/wrapbox/ or app/tools/halibut/ — out of scope by
    # construction, no exclude needed.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y cmake ninja-build clang clang-tidy libgtk-3-dev libcmocka-dev zlib1g-dev libzip-dev libmxml-dev librsvg2-bin gettext
      - name: Configure and build (need generated headers for clang-tidy to parse cleanly)
        run: |
          # -DCMAKE_C_COMPILER=clang (SF #693) matters beyond just matching clang-tidy's own
          # frontend: without it CMAKE_C_COMPILER_ID resolves to the runner's default gcc, which
          # flips two PlatformSettings.cmake/CMakeLists.txt Clang-conditional guards backwards --
          # wrongly enabling the GCC-only -Werror=cast-function-type (which Clang's frontend
          # treats as also promoting the noisy -Wcast-function-type-strict sub-check to a hard
          # error) and wrongly skipping paths.c's -Wno-error=implicit-fallthrough exemption.
          # Together those blew through Clang's error-emission ceiling and aborted the run early
          # ("too many errors emitted, stopping now"), misattributed to whichever file was queued
          # last rather than any real problem in that file.
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DXTRKCAD_TESTING=OFF -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DCMAKE_C_COMPILER=clang
          cmake --build build
      - name: Run clang-tidy (non-fatal)
        run: |
          # utility.c/misc.c are each legitimately compiled into two targets (xtrkcad-lib plus a
          # separate tool: cnvdsgn, and an app/i18n extraction tool respectively), so they get two
          # compile_commands.json entries each -- clang-tidy's own "[N/139]" progress counter can
          # exceed the 139 filename arguments below by a couple as a result. That's expected, not
          # a sign of a duplicate/broken entry.
          mapfile -t FILES < <(find app/bin app/dynstring app/cornu -name "*.c" | grep -v unittest | grep -vE 'bdf2xtp\.c|helphelper\.c|ppedit_gtk1\.c')
          clang-tidy --checks='-*,bugprone-*,performance-*,portability-*' -p build "${FILES[@]}" > clang-tidy.txt 2>&1 || true
          # compile_commands.json stores absolute paths, so clang-tidy emits
          # diagnostics as e.g. "/home/runner/work/XTrkCAD/XTrkCAD/app/bin/foo.c:12:...".
          # Strip the workspace prefix so this artifact's paths stay repo-relative,
          # matching package-clang-tidy in release.yml (kept in sync by hand).
          sed -i "s|${GITHUB_WORKSPACE}/||g" clang-tidy.txt
      - name: Summarise findings
        run: |
          COUNT=$(grep -cE '\[[a-zA-Z.-]+\]$' clang-tidy.txt || echo 0)
          echo "Total findings: $COUNT"
          echo ""
          echo "=== By check ==="
          grep -oE '\[[a-zA-Z.-]+\]$' clang-tidy.txt | sort | uniq -c | sort -rn || true
      - name: Upload findings
        uses: actions/upload-artifact@v7
        with:
          name: clang-tidy-gtk3
          path: clang-tidy.txt

  codespell:
    # Report-only: scans comments/strings/identifiers in app/bin and app/wlib for common
    # misspellings. 134 findings on the real (post-cleanup) baseline, 2026-07-20 -- see
    # .claude/codespell-triage-plan.md for the working backlog. Not yet a quality gate.
    #
    # *.ai (Adobe Illustrator icon sources) are explicitly skipped: they're not text
    # files, and codespell parsing them as text produced ~1090 pieces of pure garbage
    # ("nD", "bU", "UE", ...) on the first run -- 82% of the initial ~1300-finding total
    # was this one false-positive source, confirmed by re-running with *.ai excluded.
    #
    # .github/codespell-ignore.txt holds confirmed false positives: short C-style
    # identifier/abbreviation names that only coincidentally fuzzy-match a real word
    # once codespell tokenizes on camelCase boundaries (easeR, parm/parms, protoL,
    # drawM, groupD, sCond, RMOVE, siz) plus one valid British spelling (co-ordinate).
    # Genuine misspellings embedded IN identifier names themselves (modifyable,
    # editted, childs) are deliberately left un-ignored and tracked in the triage plan
    # instead -- fixing those means renaming the identifier everywhere it's used, not
    # just editing a comment, so they need a real (if small) code change, not a
    # spell-check suppression.
    #
    # Vendored-code exclusion: app/wlib/gtk3lib/wrapbox/ and app/tools/halibut/ are
    # skipped via --skip (same vendored list as astyle-check/quality-plan-gtk3v2main-part2.md
    # Phase 8) -- app/tools/halibut/ isn't reached by this job's scope anyway, but
    # app/wlib is, so wrapbox/ does need the explicit skip here unlike cppcheck-deep.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install codespell
        run: sudo apt-get update -q && sudo apt-get install -y codespell
      - name: Run codespell (non-fatal)
        run: |
          codespell app/bin app/wlib \
            --skip='*/wrapbox/*,*/halibut/*,*.ai' \
            --ignore-words=.github/codespell-ignore.txt \
            -q 3 > codespell.txt 2>&1 || true
      - name: Summarise findings
        run: |
          COUNT=$(wc -l < codespell.txt || echo 0)
          echo "Total findings: $COUNT"
      - name: Upload findings
        uses: actions/upload-artifact@v7
        with:
          name: codespell-gtk3
          path: codespell.txt

  docs-drift-check:
    # Non-blocking reminder, not a gate. Doxygen's own build-time gate (the doxygen job
    # above) catches broken doc *syntax* -- it can't catch doc *content* that's gone
    # stale because the CI/CMake behavior it describes changed underneath it. That
    # exact gap bit twice in one session 2026-07-31: a devguide caveat about a known
    # regression-test false-failure (gtk3issues #21) was added to docs/doxygen/mainpage.md
    # in the same PR as the CI fix it explains (PR #67), then a second, separate gap
    # (the Linux quickstart's plain `ctest` silently picking up the same false-failure
    # class) was only caught by a follow-up human question, not any automation -- see
    # bug-tracker.md's Action Queue item 17 and PR #68. This job just flags -- via a
    # step-summary comment, not a failing check -- when a PR touches CI workflows or
    # CMake build files without touching docs/doxygen/, so a reviewer gets nudged to
    # ask "does this need a devguide update?" instead of relying on catching it by eye.
    # Deliberately a path-based heuristic, not a semantic check: it can't tell a
    # docs-irrelevant change (e.g. a timeout bump) from one that actually needs a
    # devguide update, so false positives are expected and fine -- it's a prompt for a
    # human judgment call, not a verdict.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check for CI/CMake changes without a matching docs update
        run: |
          CHANGED=$(git diff --name-only "origin/${{ github.base_ref }}"...HEAD)
          CI_CMAKE_CHANGED=$(echo "$CHANGED" | grep -E '^(\.github/workflows/|CMakeLists\.txt$|.*\.cmake$)' || true)
          DOCS_CHANGED=$(echo "$CHANGED" | grep -E '^docs/doxygen/' || true)
          if [ -n "$CI_CMAKE_CHANGED" ] && [ -z "$DOCS_CHANGED" ]; then
            {
              echo "### :memo: Devguide reminder"
              echo
              echo "This PR changes CI workflow or CMake build files but not \`docs/doxygen/\`:"
              echo
              echo '```'
              echo "$CI_CMAKE_CHANGED"
              echo '```'
              echo
              echo "If this change affects behavior the devguide describes (build/test steps,"
              echo "CI gates, CMake options), please update \`docs/doxygen/mainpage.md\`/"
              echo "\`advanced.md\` too. If not, this is just a heuristic nudge -- ignore it."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  astyle-check:
    # Gating: fails if any tracked app/bin or app/wlib file is not conformant
    # with app/lib/astylerc. astyle's --dry-run always exits 0, so the gate
    # parses its output for "Formatted" lines rather than relying on the exit
    # code.
    #
    # Vendored-code exclusion list (quality-plan-gtk3v2main-part2.md Phase 8
    # — encoded here so it doesn't need to be re-derived by hand each phase):
    #   - app/wlib/gtk3lib/wrapbox/eggwrapbox.c and testwrapbox.c: upstream
    #     GTK "eggwrapbox" widget, vendored verbatim. Both excluded via
    #     --exclude=wrapbox (matches the directory; verified empirically that
    #     astyle's --exclude matches full path components, not substrings, so
    #     this can't accidentally match an unrelated file).
    #   - app/tools/halibut/: vendored doc-processing tool. Never in scope
    #     here by construction — this job's file globs only cover app/bin and
    #     app/wlib, and halibut lives under app/tools.
    #   - unittest/ dirs: excluded separately (see quality-plan-gtk3v2main.md
    #     Phase 0) — some unittest sources are deliberately non-conformant.
    #
    # astyle is built from source and pinned to ASTYLE_VERSION rather than
    # installed via apt: the apt-resolved version drifts silently whenever
    # the distro package updates, which is exactly what caused the drift in
    # SF #638 (2026-07-12) — an older/different astyle version produced
    # different continuation-line indentation for the same input. A later
    # comment on that bug asked for CI to pin 3.6.x specifically; building
    # from source lets every job (this one, astyle-check-macos,
    # astyle-check-windows) run the identical version regardless of what
    # each platform's package manager happens to ship.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ASTYLE_VERSION: 3.6.13
    steps:
      - uses: actions/checkout@v7
      - name: Build astyle ${{ env.ASTYLE_VERSION }} from source
        run: |
          curl -sL -o astyle.tar.bz2 "https://sourceforge.net/projects/astyle/files/astyle/astyle%20${ASTYLE_VERSION%.*}/astyle-${ASTYLE_VERSION}.tar.bz2/download"
          tar xjf astyle.tar.bz2
          make -C "astyle-${ASTYLE_VERSION}/build/gcc" -j"$(nproc)"
      - name: Check formatting (dry-run)
        run: |
          ASTYLE="$PWD/astyle-${ASTYLE_VERSION}/build/gcc/bin/astyle"
          "$ASTYLE" --version
          OUTPUT=$("$ASTYLE" --options=app/lib/astylerc --dry-run -Q --recursive --ignore-exclude-errors \
            --exclude=wrapbox \
            --exclude=unittest \
            "app/bin/*.c" "app/bin/*.h" "app/wlib/*.c" "app/wlib/*.h" 2>&1 | grep '^Formatted' || true)
          if [ -n "$OUTPUT" ]; then
            echo "$OUTPUT"
            echo "::error::Non-conformant files found. Run: astyle --options=app/lib/astylerc <file>"
            exit 1
          fi
          echo "All files conform to app/lib/astylerc."

  astyle-check-macos:
    # Report-only, NOT gating: verifies that astyle built from source on
    # macOS agrees with the pinned Linux astyle-check gate above for the
    # same source tree. Added 2026-07-13 after an SF reviewer found
    # historical cross-changeset indentation drift on cjoin.c and asked
    # whether astyle is platform-dependent. Originally used `brew install
    # astyle`, but Homebrew's formula isn't version-pinned; switched
    # 2026-07-14 to build the same ASTYLE_VERSION from source as the Linux
    # gate (see astyle-check's comment — SF #638 asked for 3.6.x to be
    # pinned everywhere) so this job now isolates compiler/OS differences
    # rather than astyle-version differences. Kept report-only since a
    # disagreement here would still point to a toolchain quirk unrelated to
    # the PR's actual content.
    runs-on: macos-latest
    timeout-minutes: 20
    env:
      ASTYLE_VERSION: 3.6.13
    steps:
      - uses: actions/checkout@v7
      - name: Build astyle ${{ env.ASTYLE_VERSION }} from source
        run: |
          curl -sL -o astyle.tar.bz2 "https://sourceforge.net/projects/astyle/files/astyle/astyle%20${ASTYLE_VERSION%.*}/astyle-${ASTYLE_VERSION}.tar.bz2/download"
          tar xjf astyle.tar.bz2
          make -C "astyle-${ASTYLE_VERSION}/build/gcc" -j"$(sysctl -n hw.ncpu)"
      - name: Compare formatting output (non-fatal)
        run: |
          ASTYLE="$PWD/astyle-${ASTYLE_VERSION}/build/gcc/bin/astyle"
          "$ASTYLE" --version
          OUTPUT=$("$ASTYLE" --options=app/lib/astylerc --dry-run -Q --recursive --ignore-exclude-errors \
            --exclude=wrapbox \
            --exclude=unittest \
            "app/bin/*.c" "app/bin/*.h" "app/wlib/*.c" "app/wlib/*.h" 2>&1 | grep '^Formatted' || true)
          if [ -n "$OUTPUT" ]; then
            echo "$OUTPUT"
            echo "::warning::macOS astyle disagrees with the pinned Linux astyle-check gate on the files above — see job comment for context."
          else
            echo "macOS astyle agrees with the Linux gate: all files conform."
          fi

  astyle-check-windows:
    # Report-only, NOT gating — see astyle-check-macos above for rationale.
    # Uses MSYS2 (matching c-tests-windows-msys2's toolchain) rather than a
    # native Win32 astyle build, since that's the toolchain actually used to
    # build this project on Windows. Originally installed
    # mingw-w64-x86_64-astyle via pacman; switched 2026-07-14 to build the
    # same pinned ASTYLE_VERSION from source (see astyle-check's comment)
    # so all three astyle jobs run the identical version.
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: msys2 {0}
    env:
      ASTYLE_VERSION: 3.6.13
    steps:
      - uses: actions/checkout@v7
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-gcc make
      - name: Build astyle ${{ env.ASTYLE_VERSION }} from source
        run: |
          curl -sL -o astyle.tar.bz2 "https://sourceforge.net/projects/astyle/files/astyle/astyle%20${ASTYLE_VERSION%.*}/astyle-${ASTYLE_VERSION}.tar.bz2/download"
          tar xjf astyle.tar.bz2
          make -C "astyle-${ASTYLE_VERSION}/build/gcc" -j"$(nproc)"
      - name: Compare formatting output (non-fatal)
        run: |
          ASTYLE="$PWD/astyle-${ASTYLE_VERSION}/build/gcc/bin/astyle"
          "$ASTYLE" --version
          OUTPUT=$("$ASTYLE" --options=app/lib/astylerc --dry-run -Q --recursive --ignore-exclude-errors \
            --exclude=wrapbox \
            --exclude=unittest \
            "app/bin/*.c" "app/bin/*.h" "app/wlib/*.c" "app/wlib/*.h" 2>&1 | grep '^Formatted' || true)
          if [ -n "$OUTPUT" ]; then
            echo "$OUTPUT"
            echo "::warning::Windows/MSYS2 astyle disagrees with the pinned Linux astyle-check gate on the files above — see job comment for context."
          else
            echo "Windows/MSYS2 astyle agrees with the Linux gate: all files conform."
          fi

  fuzz-getargs:
    # Gating, bounded-time regression check (not continuous fuzzing
    # infrastructure) for GetArgs() (getargs.c), the format-string parser
    # used throughout the .xtc/.xtr/.xtp file readers to pull typed fields
    # out of untrusted file lines. Reuses the c-tests-sanitizers job's
    # clang+ASan/UBSan toolchain, plus libFuzzer (-fsanitize=fuzzer).
    #
    # Deliberately covers only the format codes verified safe by an
    # extended local fuzzing run (60M+ executions, 0 crashes) -- see
    # fuzz_getargs.c's file comment for why one format code is excluded.
    # Including it here would make this job permanently red on a known,
    # already-tracked issue instead of being a useful gate against new
    # regressions.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y cmake ninja-build clang libgtk-3-dev libcmocka-dev zlib1g-dev libzip-dev libmxml-dev librsvg2-bin gettext
      - name: Configure and build fuzz_getargs
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DXTRKCAD_TESTING=OFF -DXTRKCAD_FUZZ=ON -DCMAKE_C_COMPILER=clang
          cmake --build build --target fuzz_getargs
      - name: Run fuzz_getargs (bounded time budget)
        run: ./build/app/bin/fuzz/fuzz_getargs -max_total_time=120

  compiler-warnings:
    # Report-only: captures -Wall -Wextra output as an artifact.
    # Does NOT fail the build — legacy code has pre-existing warnings.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y cmake ninja-build libgtk-3-dev libcmocka-dev zlib1g-dev libzip-dev libmxml-dev librsvg2-bin
      - name: Configure with -Wall -Wextra
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DXTRKCAD_TESTING=ON \
            -DCMAKE_C_FLAGS="-Wall -Wextra -Wno-unused-parameter"
      - name: Build (warnings captured, non-fatal)
        run: cmake --build build 2>&1 | tee build/warnings.txt || true
      - name: Summarise warnings
        run: |
          COUNT=$(grep -c ': warning:' build/warnings.txt || echo 0)
          echo "Total warnings: $COUNT"
          echo ""
          echo "=== By warning flag ==="
          grep ': warning:' build/warnings.txt | grep -oE '\[-W[^]]+\]' | sort | uniq -c | sort -rn || true
          echo ""
          echo "=== By file (top 20) ==="
          grep ': warning:' build/warnings.txt | grep -oE '^[^:]+' | sed 's|.*/||' | sort | uniq -c | sort -rn | head -20 || true
      - name: Upload warning log
        uses: actions/upload-artifact@v7
        with:
          name: compiler-warnings-gtk3-linux
          path: build/warnings.txt

  compiler-warnings-macos:
    # Report-only: captures -Wall -Wextra output on macOS/clang as an artifact.
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: brew install ninja gtk+3 cmocka libzip librsvg
      - name: Configure with -Wall -Wextra
        run: |
          GTK_PREFIX=$(brew --prefix gtk+3)
          PKG_CONFIG_PATH="$GTK_PREFIX/lib/pkgconfig:$(brew --prefix)/lib/pkgconfig"
          export PKG_CONFIG_PATH
          GTK_LDFLAGS=$(pkg-config --libs-only-L gtk+-3.0)
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DXTRKCAD_TESTING=ON \
            -DCMAKE_PREFIX_PATH="$GTK_PREFIX;$(brew --prefix)" \
            -DCMAKE_EXE_LINKER_FLAGS="$GTK_LDFLAGS" \
            -DXTRKCAD_USE_APPLEHELP=OFF -DXTRKCAD_USE_BROWSER=ON \
            -DCMAKE_C_FLAGS="-Wall -Wextra -Wno-unused-parameter"
      - name: Build (warnings captured, non-fatal)
        run: cmake --build build 2>&1 | tee build/warnings.txt || true
      - name: Summarise warnings
        run: |
          COUNT=$(grep -c ': warning:' build/warnings.txt || echo 0)
          echo "Total warnings: $COUNT"
          echo ""
          echo "=== By warning flag ==="
          grep ': warning:' build/warnings.txt | grep -oE '\[-W[^]]+\]' | sort | uniq -c | sort -rn || true
          echo ""
          echo "=== By file (top 20) ==="
          grep ': warning:' build/warnings.txt | grep -oE '^[^:]+' | sed 's|.*/||' | sort | uniq -c | sort -rn | head -20 || true
      - name: Upload warning log
        uses: actions/upload-artifact@v7
        with:
          name: compiler-warnings-gtk3-macos
          path: build/warnings.txt

  compiler-warnings-windows:
    # Report-only: captures -Wall -Wextra output on Windows/MinGW64 as an artifact.
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pkg-config
            mingw-w64-x86_64-gtk3
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-libzip
            mingw-w64-x86_64-mxml
            mingw-w64-x86_64-librsvg
            mingw-w64-x86_64-cmocka
      - name: Configure with -Wall -Wextra
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DXTRKCAD_TESTING=ON \
            -DXTRKCAD_USE_GETTEXT=OFF \
            -DCMAKE_C_FLAGS="-Wall -Wextra -Wno-unused-parameter"
      - name: Build (warnings captured, non-fatal)
        run: cmake --build build --parallel 2>&1 | tee build/warnings.txt || true
      - name: Summarise warnings
        run: |
          COUNT=$(grep -c ': warning:' build/warnings.txt || echo 0)
          echo "Total warnings: $COUNT"
          echo ""
          echo "=== By warning flag ==="
          grep ': warning:' build/warnings.txt | grep -oE '\[-W[^]]+\]' | sort | uniq -c | sort -rn || true
          echo ""
          echo "=== By file (top 20) ==="
          grep ': warning:' build/warnings.txt | grep -oE '^[^:]+' | sed 's|.*/||' | sort | uniq -c | sort -rn | head -20 || true
      - name: Upload warning log
        uses: actions/upload-artifact@v7
        with:
          name: compiler-warnings-gtk3-windows
          path: build/warnings.txt

  coverage:
    # Report-only: generates an lcov HTML report and uploads it as an artifact.
    #
    # Runs unit tests AND the full regression demo-playback suite together
    # (no -LE regression filter) with branch coverage enabled. A unit-tests-
    # only measurement was found 2026-08-05 to be nearly meaningless: only
    # ~3,400 lines even get instrumented that way (essentially none of
    # app/bin's real command/draw/UI code links into any CMocka binary), vs.
    # ~64,000 lines once the regression suite runs the actual app binary.
    # Branch coverage specifically is what's diagnostic for the #667 class of
    # bug (JoinWithStraight() was called 318 times by the suite -- function-
    # level coverage would show it as exercised -- but one always-false
    # branch inside it never took the true path once). See
    # .claude/devml-coverage-report-2026-08-05.md (sent to the dev mailing
    # list) for the full writeup.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y cmake ninja-build libgtk-3-dev libcmocka-dev zlib1g-dev libzip-dev libmxml-dev librsvg2-bin gettext xvfb lcov
      - name: Configure with coverage flags
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DXTRKCAD_TESTING=ON \
            -DCMAKE_C_FLAGS="--coverage" -DCMAKE_EXE_LINKER_FLAGS="--coverage"
      - name: Build
        run: cmake --build build
      - name: Run tests (unit + full regression suite)
        # Outer xvfb-run: PreferenceTest (a plain unit test, not itself
        # regression-labeled) needs a real DISPLAY on CI's headless runners,
        # same reason c-tests-linux's -LE regression run has one. Regression
        # tests each additionally self-wrap in their own nested xvfb-run
        # (RegressionTests.cmake bakes that into every regression test's
        # COMMAND unconditionally) -- nesting is harmless, each xvfb-run
        # picks its own free display number.
        run: xvfb-run ctest --test-dir build --output-on-failure
      - name: Collect coverage
        run: |
          lcov --capture --directory build \
               --output-file build/coverage.info \
               --ignore-errors mismatch --rc branch_coverage=1
          lcov --remove build/coverage.info \
               '/usr/*' '*/build/*' '*/unittest/*' '*/tools/*' \
               --output-file build/coverage-filtered.info \
               --ignore-errors unused --rc branch_coverage=1
          genhtml build/coverage-filtered.info \
                  --output-directory build/coverage-html \
                  --title "XTrkCAD coverage (GTK3, unit + regression suite)" \
                  --rc branch_coverage=1
          lcov --summary build/coverage-filtered.info --rc branch_coverage=1
      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report-gtk3
          path: build/coverage-html/
