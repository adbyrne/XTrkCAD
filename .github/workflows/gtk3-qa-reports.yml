name: GTK3 QA reports (reusable)

# The report-only analysis jobs, written once. Callers:
#   - ci-gtk3.yml (html: false): plain-text findings as PR artifacts.
#   - release.yml (html: true): grouped, linked HTML for GitHub Pages, via
#     tools/format-findings-report.sh. deploy-pages unpacks the
#     xtrkcad-*-html artifacts these jobs upload.
#   - ci-gtk3-preview.yml (on the next Ubuntu): previews what newer cppcheck,
#     clang-tidy and GCC versions report before ci-gtk3.yml moves over.
# These used to be hand-copied twins in ci-gtk3.yml and release.yml, and the
# copies drifted more than once (the published reports missed scope
# widenings for weeks). None of these jobs ever fails the run.

on:
  workflow_call:
    inputs:
      runner:
        description: Linux runner label.
        type: string
        default: ubuntu-24.04
      html:
        description: Publish HTML report artifacts (xtrkcad-<tool>-html) instead of plain-text findings.
        type: boolean
        default: false
      coverage:
        description: Run the coverage job.
        type: boolean
        default: true
      artifact-suffix:
        description: Appended to the plain-text artifact names, e.g. -ubuntu2604.
        type: string
        default: ''

jobs:
  coverage:
    # Generates an lcov HTML report.
    #
    # Runs unit tests AND the full regression demo-playback suite together
    # (no -LE regression filter) with branch coverage enabled. A unit-tests-
    # only measurement was found 2026-08-05 to be nearly meaningless: only
    # ~3,400 lines even get instrumented that way (essentially none of
    # app/bin's real command/draw/UI code links into any CMocka binary), vs.
    # ~64,000 lines once the regression suite runs the actual app binary.
    # Branch coverage specifically is what's diagnostic for the #667 class of
    # bug (JoinWithStraight() was called 318 times by the suite -- function-
    # level coverage would show it as exercised -- but one always-false
    # branch inside it never took the true path once). See
    # .claude/devml-coverage-report-2026-08-05.md (sent to the dev mailing
    # list) for the full writeup.
    if: inputs.coverage
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/apt-deps
        with:
          extra: lcov
      - name: Configure with coverage flags
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DXTRKCAD_TESTING=ON \
            -DCMAKE_C_FLAGS="--coverage" -DCMAKE_EXE_LINKER_FLAGS="--coverage"
      - name: Build
        run: cmake --build build
      - name: Run tests (unit + full regression suite)
        # Outer xvfb-run: PreferenceTest (a plain unit test, not itself
        # regression-labeled) needs a real DISPLAY on CI's headless runners,
        # same reason c-tests-linux's -LE regression run has one. Regression
        # tests each additionally self-wrap in their own nested xvfb-run
        # (RegressionTests.cmake bakes that into every regression test's
        # COMMAND unconditionally) -- nesting is harmless, each xvfb-run
        # picks its own free display number.
        run: xvfb-run ctest --test-dir build --output-on-failure
      - name: Collect coverage
        run: |
          lcov --capture --directory build \
               --output-file build/coverage.info \
               --ignore-errors mismatch --rc branch_coverage=1
          lcov --remove build/coverage.info \
               '/usr/*' '*/build/*' '*/unittest/*' '*/tools/*' \
               --output-file build/coverage-filtered.info \
               --ignore-errors unused --rc branch_coverage=1
          genhtml build/coverage-filtered.info \
                  --output-directory build/coverage-html \
                  --title "XTrkCAD coverage (GTK3, unit + regression suite)" \
                  --rc branch_coverage=1
          lcov --summary build/coverage-filtered.info --rc branch_coverage=1
      - name: Upload coverage report
        if: ${{ !inputs.html }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report-gtk3${{ inputs.artifact-suffix }}
          path: build/coverage-html/
      - name: Archive coverage report
        if: inputs.html
        run: tar -czf xtrkcad-coverage.tar.gz -C build/coverage-html .
      - name: Upload coverage report (HTML)
        if: inputs.html
        uses: actions/upload-artifact@v7
        with:
          name: xtrkcad-coverage-html
          path: xtrkcad-coverage.tar.gz
          retention-days: 14

  cppcheck-deep:
    # The gating `cppcheck` job (gtk3-toolchain.yml) only runs cppcheck's
    # default (error-only) severity class. This runs the warning/style/
    # performance/portability classes too -- most of what cppcheck actually
    # checks -- but does NOT fail the build: ~1150 findings surfaced the first
    # time this was run (2026-07-11), almost entirely pre-existing and
    # untriaged. Findings here are a triage backlog, not yet a quality gate.
    #
    # selfAssignment is suppressed for cdraw.c/drawgeom.c specifically: both
    # files use REORIGIN()/UNREORIGIN() macros as in-place coordinate
    # transforms, always called as REORIGIN(x, x, ...) (dest == src by
    # design). cppcheck's selfAssignment check can't see through the macro
    # and flags every call as a no-op assignment; verified 2026-07-11 that
    # all 29 instances across both files are this same pattern, not bugs.
    #
    # Vendored-code exclusion list (quality-plan-gtk3v2main-part2.md Phase 8):
    # this job's file list is a non-recursive shell glob, so it never reaches
    # app/wlib/gtk3lib/wrapbox/ -- out of scope by construction, no exclude
    # needed (app/tools/halibut/ was deleted, SF #219). app/tools/dirent.c is
    # reached by the app/help+app/tools widening (SF #701/#729-730 follow-up)
    # and is explicitly excluded -- vendored public-domain Win32 dirent shim.
    #
    # app/wlib/gtk3lib(+unix/) added 2026-09-02, same scope/exclusions as the
    # gating cppcheck job (queued since the app/bin shadowVariable/for-loop
    # gates landed).
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/apt-deps
        with:
          base: 'false'
          extra: cppcheck
      - name: Run cppcheck (deep, non-fatal)
        run: |
          cppcheck --version
          cppcheck \
            --enable=warning,style,performance,portability \
            --inline-suppr \
            -j 4 \
            --suppress=missingInclude \
            --suppress=missingIncludeSystem \
            --suppress=nullPointerOutOfMemory \
            --suppress=nullPointerOutOfResources \
            --suppress=nullPointerArithmeticOutOfMemory \
            --suppress=syntaxError:app/bin/archive.c \
            --suppress=syntaxError:app/bin/cturntbl.c \
            --suppress=syntaxError:app/bin/directory.c \
            --suppress=syntaxError:app/bin/paths.c \
            --suppress=syntaxError:app/bin/utility.c \
            --suppress=unknownMacro:app/bin/custom.c \
            --suppress=unknownMacro:app/wlib/gtk3lib/stickytogglebutton.h \
            --suppress=ctunullpointer:app/bin/track.c \
            --suppress=uninitvar:app/bin/levenshtein.c \
            --suppress=uninitvar:app/bin/problemrep.c \
            --suppress=uninitvar:app/bin/paths.c \
            --suppress=nullPointer:app/bin/partcatalog.c \
            --suppress=missingReturn:app/bin/cturnout.c \
            --suppress=ctuPointerArith:app/bin/cturnout.c \
            --suppress=selfAssignment:app/bin/cdraw.c \
            --suppress=selfAssignment:app/bin/drawgeom.c \
            -I app/bin -I app/bin/include -I app/wlib/include -I app/wlib/gtk3lib \
            app/bin/*.c app/dynstring/*.c \
            app/help/*.c app/tools/listxtp.c \
            app/wlib/gtk3lib/*.c app/wlib/gtk3lib/unix/*.c > cppcheck-deep.txt 2>&1 || true
      - name: Summarise findings
        run: |
          COUNT=$(grep -cE '\[[a-zA-Z]+\]$' cppcheck-deep.txt || echo 0)
          echo "Total findings: $COUNT"
          echo ""
          echo "=== By check ==="
          grep -oE '\[[a-zA-Z]+\]$' cppcheck-deep.txt | sort | uniq -c | sort -rn || true
      - name: Upload findings
        if: ${{ !inputs.html }}
        uses: actions/upload-artifact@v7
        with:
          name: cppcheck-deep-gtk3${{ inputs.artifact-suffix }}
          path: cppcheck-deep.txt
      - name: Format as HTML
        if: inputs.html
        run: |
          mkdir -p report
          tools/format-findings-report.sh cppcheck-deep.txt report/index.html \
            "cppcheck-deep findings" bracketed \
            "${{ github.server_url }}/${{ github.repository }}/blob/${{ github.sha }}/"
          tar -czf xtrkcad-cppcheck-deep.tar.gz -C report .
      - name: Upload report (HTML)
        if: inputs.html
        uses: actions/upload-artifact@v7
        with:
          name: xtrkcad-cppcheck-deep-html
          path: xtrkcad-cppcheck-deep.tar.gz
          retention-days: 14

  clang-tidy:
    # Conservative check-set (bugprone-*/performance-*/portability-*)
    # scoped to app/bin+app/dynstring+app/cornu+app/help+app/tools (the last
    # two added SF #701/#729-730 follow-up, bug-tracker.md Action Queue item
    # 22). Excludes bdf2xtp.c and ppedit_gtk1.c (dead code, not referenced by
    # any CMakeLists.txt target) and helphelper.c (macOS-only, if(APPLE) in
    # app/bin/CMakeLists.txt) -- none of the three are part of the Linux
    # build's compile_commands.json, so clang-tidy can't get real compile
    # flags for them and errors out. Also excludes app/tools/dirent.c/
    # dirent.h, a vendored public-domain Win32 dirent shim (Kevlin Henney,
    # 1997/2003) -- same treatment as the other vendored exclusions below.
    # readability-*/modernize-* deliberately excluded for now -- expected to
    # be high-volume style-only noise on this legacy C codebase.
    #
    # bugprone-easily-swappable-parameters also excluded (2026-08-31): ~305
    # instances, 4th-largest category. SF #734 traced the highest-risk subset
    # (20 findings where clang-tidy flags parameters of the exact same
    # declared type, e.g. two coOrd/DIST_T args) to every call site and found
    # zero real bugs -- all pass arguments in declared order via
    # identically-named locals/struct fields, or are registered once into a
    # compiler-enforced function-pointer dispatch table where a swap can't
    # happen. The remaining ~100 "broader convertible types" instances (two
    # BOOL_T flags, etc.) were never worth auditing on the same evidence.
    # Given this check's near-zero real hit rate here against a C codebase
    # whose calling convention already mitigates the risk it warns about,
    # filtered out entirely rather than left as permanent unactioned noise.
    #
    # Vendored-code exclusion list (quality-plan-gtk3v2main-part2.md Phase 8):
    # the `find app/bin app/dynstring app/cornu app/help app/tools` root list
    # never reaches app/tools/halibut/ (deleted, SF #219) -- out of scope by
    # construction, no exclude needed.
    #
    # app/wlib/gtk3lib added 2026-09-02 (queued since the app/bin shadowVariable/for-loop gates
    # landed). Unlike the other roots, `find` here IS recursive into gtk3lib's subdirectories, so
    # two exclusions are explicit rather than by construction: win32/ (Windows-only sources,
    # gtk3lib/CMakeLists.txt guards them behind if(WIN32) so they're never in this Linux build's
    # compile_commands.json -- same "clang-tidy can't get real compile flags" problem as
    # bdf2xtp.c/helphelper.c/ppedit_gtk1.c above) and wrapbox/ (vendored GTK "eggwrapbox" widget,
    # same treatment as astyle-check's --exclude=wrapbox -- it IS built on Linux via its own
    # add_subdirectory(), so it needs an explicit exclude unlike win32/). gtk3lib/unix/ has no
    # exclusion -- it's real project code, built and in scope.
    #
    # Also excludes (2026-08-31, found while investigating report quality):
    # app/bin/uthash.h + app/bin/include/utlist.h (Troy D. Hanson, vendored,
    # same BSD-style header-only libraries) and app/cJSON/cJSON.h (Dave
    # Gamble, vendored, has its own LICENSE file) -- 199 of 859
    # post-header-filter findings (23%) traced to these three vendored
    # headers, almost all bugprone-macro-parentheses firing inside uthash.h's
    # own macro definitions, not fixable without diverging from upstream.
    # app/bin/stringxtc.c (Linus Torvalds, vendored Linux kernel string
    # routines, 1 finding) can't go through header-filter since it's compiled
    # as its own main file, not reached as a header -- excluded from the file
    # list instead, same treatment as dirent.c.
    #
    # NOTE (2026-08-31): this exclusion was originally implemented via
    # --exclude-header-filter, which is broken on this job's actual runner --
    # ubuntu-24.04's apt clang-tidy package predates the flag entirely and
    # exits immediately with "Unknown command line argument", and the `|| true`
    # on the invocation swallowed that failure silently, leaving
    # clang-tidy.txt with just the two-line error and the job reporting a
    # false "Total findings: 0" for this whole job's lifetime (confirmed via
    # the actual uploaded clang-tidy-gtk3 artifact from the first run after
    # the flag was added). --exclude-header-filter can't be replaced with a
    # plain file-list exclusion either: uthash.h/utlist.h/cJSON.h are headers,
    # not their own compilation units, so they're never in ${FILES[@]} to
    # begin with -- the findings come from *diagnostics reported inside them*
    # when included by a real project .c file. Fixed by post-filtering
    # clang-tidy.txt after the run instead (see the awk step below), which
    # reproduces --exclude-header-filter's actual semantics on any clang-tidy
    # version: drop a finding only when its own primary file:line:col is
    # inside one of the three vendored headers, while leaving alone
    # diagnostics whose *notes* merely trace back through a uthash.h macro
    # expansion -- those notes belong to a real finding in project code and
    # must stay. Verified against a full local run: 902 raw findings (current
    # baseline) -> 711 after this filter, with zero remaining primary
    # (warning:/error:) lines pointing at the three vendored headers.
    runs-on: ${{ inputs.runner }}
    # 30 minutes leaves room for a slow apt mirror; see compiler-warnings in gtk3-qa-reports.yml.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/apt-deps
        with:
          extra: clang clang-tidy
      - name: Configure and build (need generated headers for clang-tidy to parse cleanly)
        run: |
          # -DCMAKE_C_COMPILER=clang (SF #693) matters beyond just matching clang-tidy's own
          # frontend: without it CMAKE_C_COMPILER_ID resolves to the runner's default gcc, which
          # flips two PlatformSettings.cmake/CMakeLists.txt Clang-conditional guards backwards --
          # wrongly enabling the GCC-only -Werror=cast-function-type (which Clang's frontend
          # treats as also promoting the noisy -Wcast-function-type-strict sub-check to a hard
          # error) and wrongly skipping paths.c's -Wno-error=implicit-fallthrough exemption.
          # Together those blew through Clang's error-emission ceiling and aborted the run early
          # ("too many errors emitted, stopping now"), misattributed to whichever file was queued
          # last rather than any real problem in that file.
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DXTRKCAD_TESTING=OFF -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DCMAKE_C_COMPILER=clang
          cmake --build build
      - name: Run clang-tidy (non-fatal)
        run: |
          clang-tidy --version
          # utility.c/misc.c are each legitimately compiled into two targets (xtrkcad-lib plus a
          # separate tool: cnvdsgn, and an app/i18n extraction tool respectively), so they get two
          # compile_commands.json entries each -- clang-tidy's own "[N/139]" progress counter can
          # exceed the 139 filename arguments below by a couple as a result. That's expected, not
          # a sign of a duplicate/broken entry.
          mapfile -t FILES < <(find app/bin app/dynstring app/cornu app/help app/tools app/wlib/gtk3lib -name "*.c" | grep -v unittest | grep -vE 'bdf2xtp\.c|helphelper\.c|ppedit_gtk1\.c|app/tools/dirent\.c|app/bin/stringxtc\.c|app/wlib/gtk3lib/win32/|app/wlib/gtk3lib/wrapbox/')
          # --header-filter='.*/app/' matters beyond style: without it, clang-tidy
          # reports on every system header (GTK/glib/atk from /usr/include, pulled
          # in via plain -I not -isystem so clang-tidy's own default system-header
          # exclusion doesn't apply to them) as if it were our own code -- 2161 of
          # 3019 raw findings (72%, 2026-08-31 measurement) were unfixable noise
          # from headers this project doesn't own. Verified this drops exactly
          # that 2161 with 858 of 859 real project findings surviving untouched
          # (the 1-finding gap is measurement noise between two ad hoc runs, not
          # lost data).
          clang-tidy --header-filter='.*/app/' --checks='-*,bugprone-*,performance-*,portability-*,-bugprone-easily-swappable-parameters' -p build "${FILES[@]}" > clang-tidy.txt 2>&1 || true
          # compile_commands.json stores absolute paths, so clang-tidy emits
          # diagnostics as e.g. "/home/runner/work/XTrkCAD/XTrkCAD/app/bin/foo.c:12:...".
          # Strip the workspace prefix so paths stay repo-relative, which the
          # HTML report's GitHub blob links also rely on.
          sed -i "s|${GITHUB_WORKSPACE}/||g" clang-tidy.txt
          # Post-filter out uthash.h/utlist.h/cJSON.h (vendored, see top comment) --
          # reimplements --exclude-header-filter's semantics by hand since the
          # runner's clang-tidy predates that flag (see top comment's NOTE for how
          # this was found). A "block" starts at a line whose own file:line:col is a
          # warning:/error: (never a note:, which only continues the parent block --
          # dropping on note: too would wrongly discard real findings whose macro
          # expansion trace merely passes through uthash.h) and runs until the next
          # such line; drop the block only when ITS OWN path matches one of the three
          # vendored headers.
          awk 'BEGIN{keep=1} /^[^:]+:[0-9]+:[0-9]+: (warning|error):/ { keep = ($0 !~ /(uthash\.h|utlist\.h|cJSON\.h):[0-9]+:[0-9]+:/) } keep' clang-tidy.txt > clang-tidy.filtered.txt
          mv clang-tidy.filtered.txt clang-tidy.txt
      - name: Summarise findings
        run: |
          COUNT=$(grep -cE '\[[a-zA-Z.-]+\]$' clang-tidy.txt || echo 0)
          echo "Total findings: $COUNT"
          echo ""
          echo "=== By check ==="
          grep -oE '\[[a-zA-Z.-]+\]$' clang-tidy.txt | sort | uniq -c | sort -rn || true
      - name: Upload findings
        if: ${{ !inputs.html }}
        uses: actions/upload-artifact@v7
        with:
          name: clang-tidy-gtk3${{ inputs.artifact-suffix }}
          path: clang-tidy.txt
      - name: Format as HTML
        if: inputs.html
        run: |
          mkdir -p report
          tools/format-findings-report.sh clang-tidy.txt report/index.html \
            "clang-tidy findings" bracketed \
            "${{ github.server_url }}/${{ github.repository }}/blob/${{ github.sha }}/"
          tar -czf xtrkcad-clang-tidy.tar.gz -C report .
      - name: Upload report (HTML)
        if: inputs.html
        uses: actions/upload-artifact@v7
        with:
          name: xtrkcad-clang-tidy-html
          path: xtrkcad-clang-tidy.tar.gz
          retention-days: 14

  codespell:
    # Scans comments/strings/identifiers in app/bin, app/wlib, app/help and
    # app/tools for common misspellings. 134 findings on the real
    # (post-cleanup) baseline, 2026-07-20 -- see .claude/codespell-triage-plan.md
    # for the working backlog. Not yet a quality gate.
    #
    # *.ai (Adobe Illustrator icon sources) are explicitly skipped: they're not text
    # files, and codespell parsing them as text produced ~1090 pieces of pure garbage
    # ("nD", "bU", "UE", ...) on the first run -- 82% of the initial ~1300-finding total
    # was this one false-positive source, confirmed by re-running with *.ai excluded.
    #
    # .github/codespell-ignore.txt holds confirmed false positives: short C-style
    # identifier/abbreviation names that only coincidentally fuzzy-match a real word
    # once codespell tokenizes on camelCase boundaries (easeR, parm/parms, protoL,
    # drawM, groupD, sCond, RMOVE, siz) plus one valid British spelling (co-ordinate).
    # Genuine misspellings embedded IN identifier names themselves (modifyable,
    # editted, childs) are deliberately left un-ignored and tracked in the triage plan
    # instead -- fixing those means renaming the identifier everywhere it's used, not
    # just editing a comment, so they need a real (if small) code change, not a
    # spell-check suppression.
    #
    # Vendored-code exclusion: app/wlib/gtk3lib/wrapbox/ is skipped via --skip (same
    # vendored list as astyle-check/quality-plan-gtk3v2main-part2.md Phase 8); the
    # */halibut/* skip pattern below is now a harmless no-op (app/tools/halibut/ was
    # deleted, SF #219) kept only so a stray halibut/ directory can't silently reappear
    # unscanned. app/wlib needs its own explicit wrapbox/ skip unlike cppcheck-deep,
    # since this job's scope is directory-based, not a non-recursive glob.
    # app/help+app/tools added SF #701/#729-730 follow-up (bug-tracker.md Action Queue
    # item 22) -- being directory-based this also now scans messages.in/tooltiptext.json/
    # xtrkcad.tip (real content) and mkimage1/mkimage3/HACKING (low-value but harmless);
    # app/tools/dirent.c/dirent.h skipped as vendored, same as the other two jobs above.
    # (The published HTML report missed the app/help+app/tools widening until this job
    # became shared, 2026-10-18.)
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/apt-deps
        with:
          base: 'false'
          extra: codespell
      - name: Run codespell (non-fatal)
        run: |
          codespell app/bin app/wlib app/help app/tools \
            --skip='*/wrapbox/*,*/halibut/*,*.ai,*/dirent.c,*/dirent.h' \
            --ignore-words=.github/codespell-ignore.txt \
            -q 3 > codespell.txt 2>&1 || true
      - name: Summarise findings
        run: |
          COUNT=$(wc -l < codespell.txt || echo 0)
          echo "Total findings: $COUNT"
      - name: Upload findings
        if: ${{ !inputs.html }}
        uses: actions/upload-artifact@v7
        with:
          name: codespell-gtk3${{ inputs.artifact-suffix }}
          path: codespell.txt
      - name: Format as HTML
        if: inputs.html
        run: |
          mkdir -p report
          tools/format-findings-report.sh codespell.txt report/index.html \
            "codespell findings" codespell \
            "${{ github.server_url }}/${{ github.repository }}/blob/${{ github.sha }}/"
          tar -czf xtrkcad-codespell.tar.gz -C report .
      - name: Upload report (HTML)
        if: inputs.html
        uses: actions/upload-artifact@v7
        with:
          name: xtrkcad-codespell-html
          path: xtrkcad-codespell.tar.gz
          retention-days: 14

  compiler-warnings:
    # Captures -Wall -Wextra output (Linux GCC). Does NOT fail the build --
    # legacy code has pre-existing warnings. The macOS and Windows variants
    # stay in ci-gtk3.yml as PR artifacts only.
    #
    # gettext (in the apt-deps base set) matters: without msgfmt the build
    # stalled generating locale .mo files and ran into the timeout instead of
    # failing fast -- see project_compiler_warnings_job_gettext_gap memory.
    #
    # 30 minutes, not 15: on 2026-10-23 the Ubuntu mirror ran at ~50 kB/s and
    # apt-deps alone took longer than 15 minutes, three times. apt-deps now
    # fails a stalled download itself, so this limit only has to bound a
    # slow one.
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/apt-deps
      - name: Configure with -Wall -Wextra
        run: |
          gcc --version | head -1
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DXTRKCAD_TESTING=ON \
            -DCMAKE_C_FLAGS="-Wall -Wextra -Wno-unused-parameter" \
            -DXTRKCAD_REPORT_POINTER_TYPES=ON
      - name: Build (warnings captured, non-fatal)
        run: cmake --build build 2>&1 | tee build/warnings.txt || true
      - name: Summarise warnings
        run: |
          COUNT=$(grep -c ': warning:' build/warnings.txt || echo 0)
          echo "Total warnings: $COUNT"
          # Distinct sites (a header warning repeats per file that includes
          # it). Normally suppressed; being fixed in stages (Development
          # Issues #52-#54): this count should only go down.
          IPT=$(grep ': warning:.*\[-Wincompatible-pointer-types\]' build/warnings.txt \
            | grep -oE '^[^ ]+:[0-9]+:[0-9]+:' | sort -u | wc -l)
          echo "Incompatible pointer types (distinct sites): $IPT"
          echo "## Incompatible pointer types: $IPT distinct sites (Development Issues #52-#54)" >> "$GITHUB_STEP_SUMMARY"
          echo ""
          echo "=== By warning flag ==="
          grep ': warning:' build/warnings.txt | grep -oE '\[-W[^]]+\]' | sort | uniq -c | sort -rn || true
          echo ""
          echo "=== By file (top 20) ==="
          grep ': warning:' build/warnings.txt | grep -oE '^[^:]+' | sed 's|.*/||' | sort | uniq -c | sort -rn | head -20 || true
      - name: Upload warning log
        if: ${{ !inputs.html }}
        uses: actions/upload-artifact@v7
        with:
          name: compiler-warnings-gtk3-linux${{ inputs.artifact-suffix }}
          path: build/warnings.txt
      - name: Format as HTML
        if: inputs.html
        run: |
          mkdir -p report
          tools/format-findings-report.sh build/warnings.txt report/index.html \
            "Compiler warnings, -Wall -Wextra (Linux)" bracketed \
            "${{ github.server_url }}/${{ github.repository }}/blob/${{ github.sha }}/"
          tar -czf xtrkcad-compiler-warnings.tar.gz -C report .
      - name: Upload report (HTML)
        if: inputs.html
        uses: actions/upload-artifact@v7
        with:
          name: xtrkcad-compiler-warnings-html
          path: xtrkcad-compiler-warnings.tar.gz
          retention-days: 14
