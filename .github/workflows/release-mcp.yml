name: Release (MCP)

# Builds the MCP server package (mcp/: sdist and wheel) and the Hillside
# tutorial PDF. For an mcp-v<version> tag it drafts a GitHub Release with all
# three attached; for a push to main (an MCP change merged) it replaces the
# rolling "latest-mcp" prerelease with them. Git-only, like the rest of mcp/;
# the app's release.yml never publishes it.
#
#   git tag mcp-v0.1.0 && git push origin mcp-v0.1.0
#
# The tag must match mcp/pyproject.toml's version (check-version). A trial
# tag, mcp-v<version>-test<N>, does the whole run and drafts a prerelease:
# delete that draft and the tag afterwards. A dispatch runs the tests and
# builds the package and PDF as artifacts, without releasing. A draft is
# published by hand once it has been looked at.

on:
  push:
    tags:
      - 'mcp-v*'
    # An MCP change merged: the same paths as ci-mcp.yml, which leaves main
    # to this workflow and runs from here (tests and the PDF).
    branches:
      - main
    paths:
      - 'mcp/**'
      - '.github/workflows/ci-mcp.yml'
      - '.github/workflows/release-mcp.yml'
  workflow_dispatch:

jobs:
  tests:
    uses: ./.github/workflows/ci-mcp.yml

  build:
    needs: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.14"
      - name: Read the package version
        id: version
        working-directory: mcp
        run: |
          version=$(uv run --no-project python -c \
            "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          # A build from main isn't the release: a .dev<run> version sorts
          # before it, and each latest-mcp wheel has its own name.
          if [ "$GITHUB_REF" = refs/heads/main ]; then
            version="$version.dev$GITHUB_RUN_NUMBER"
            sed -i "s/^version = \".*\"/version = \"$version\"/" pyproject.toml
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "MCP package version: $version"
      - name: check-version (tag matches pyproject.toml)
        if: startsWith(github.ref, 'refs/tags/mcp-v')
        run: |
          tag="${GITHUB_REF#refs/tags/mcp-v}"
          tag="${tag%-test*}"          # a trial tag, mcp-v<version>-test<N>
          if [ "$tag" != "${{ steps.version.outputs.version }}" ]; then
            echo "::error::tag mcp-v$tag doesn't match mcp/pyproject.toml version ${{ steps.version.outputs.version }}"
            exit 1
          fi
      - name: Build sdist and wheel
        working-directory: mcp
        run: uv build --out-dir dist
      - name: The Hillside tutorial's files, for users of the wheel
        # The tutorial (mcp/docs) starts from these; the wheel has no test
        # fixtures, so they're attached to the release as one zip.
        working-directory: mcp/tests/fixtures
        run: |
          uv run --no-project python - <<'EOF'
          import zipfile
          files = ["hillside_division.yaml", "hillside_floor_plan.yaml",
                   "hillside_benchwork.yaml", "hillside_track_plan.yaml",
                   "tutorial/hillside_operations.yaml"]
          with zipfile.ZipFile("../../dist/hillside-tutorial-files.zip", "w",
                               zipfile.ZIP_DEFLATED) as z:
              for f in files:
                  z.write(f, f.split("/")[-1])
          print("hillside-tutorial-files.zip:", ", ".join(files))
          EOF
      - uses: actions/upload-artifact@v7
        with:
          name: xtrkcad-mcp-${{ steps.version.outputs.version }}
          path: mcp/dist/*
          if-no-files-found: error

  github-release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/mcp-v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: xtrkcad-mcp-${{ needs.build.outputs.version }}
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: xtrkcad-mcp-tutorial-pdf
          path: dist
      - name: Draft the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          trial=""
          case "$TAG" in *-test*) trial="--prerelease" ;; esac
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --draft $trial \
            --title "XTrkCAD MCP server $VERSION${trial:+ (trial $TAG)}" \
            --notes "The MCP server for XTrkCAD layouts, version $VERSION. Install the wheel with pip or uv; see mcp/README.md. xtrkcad-mcp-hillside-tutorial.pdf is the Hillside tutorial (both parts, with the conventions spec as an appendix)."

  # Rolling prerelease of the newest MCP on main: one permanent URL,
  #   <server>/<owner>/<repo>/releases/tag/latest-mcp
  # deleted and recreated on each merge, like the app's latest-main. Never
  # marked "Latest", so the app's own releases keep that place.
  latest-mcp:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: latest-mcp-release
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: xtrkcad-mcp-${{ needs.build.outputs.version }}
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: xtrkcad-mcp-tutorial-pdf
          path: dist
      - name: Replace the rolling latest-mcp prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          ls -l dist
          gh release delete latest-mcp --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create latest-mcp dist/* --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "XTrkCAD MCP server: latest development build" \
            --notes "$(printf '%s\n' \
              '**Updated on every MCP change merged into main.** A development build, not a release.' \
              '' \
              "MCP server $VERSION, built from commit $GITHUB_SHA. Install the wheel with pip or uv; see mcp/README.md." \
              '' \
              'xtrkcad-mcp-hillside-tutorial.pdf: the Hillside tutorial, both parts, with the conventions spec as an appendix.')"
